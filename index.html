<style>
:root{
  --ink:#0b1220; --ink2:#101a2c; --surface:#16223a; --raised:#1d2c4a; --line:#27395e; --lineL:#3a5182;
  --text:#eaf0fb; --muted:#93a4c6; --dim:#63739a;
  --gold:#f4b53f; --goldD:#c98d1c; --goldInk:#f4b53f;
  --red:#e8455c; --redInk:#ff7d8d;
  --teal:#2ec4a0; --tealInk:#2ec4a0;
  --violet:#a77dff; --blue:#5b93ff;
  --onAccent:#0b1220;
  --court:#1b4f74; --kitchen:#b8592c; --courtLine:rgba(255,255,255,.7);
  --shadow:0 12px 34px rgba(0,0,0,.42);
  --r:13px;
}
html[data-theme="light"]{
  --ink:#f6f7fb; --ink2:#ffffff; --surface:#ffffff; --raised:#eef1f8; --line:#dde3ef; --lineL:#c3cddf;
  --text:#111a2c; --muted:#55637f; --dim:#8391ab;
  --gold:#d99312; --goldD:#a86f05; --goldInk:#8a5c00;
  --red:#d32a44; --redInk:#a81830;
  --teal:#12a183; --tealInk:#0a7a63;
  --violet:#7a4fd6; --blue:#2f6ce0;
  --onAccent:#ffffff;
  --shadow:0 8px 22px rgba(20,35,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  font-size:14px;line-height:1.45}
html[data-theme="dark"] body{background:
  radial-gradient(1200px 560px at 92% -10%, rgba(244,181,63,.07), transparent 60%),
  radial-gradient(900px 480px at -10% 2%, rgba(46,196,160,.06), transparent 58%), var(--ink)}
.cond{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 13px 108px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:70;background:var(--ink2);border-bottom:1px solid var(--line)}
.hd{max-width:1080px;margin:0 auto;padding:9px 13px;display:flex;align-items:center;gap:10px}
.mark{height:42px;width:auto;flex:0 0 auto;display:block;object-fit:contain}
html[data-theme="dark"] .mark{filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
.hd h1{margin:0;font-size:14.5px;font-weight:700;line-height:1.1}
.hd .sub{font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.hd .sp{margin-left:auto}
.ibtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;
  color:var(--muted);display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.04em}
.ibtn:hover{color:var(--text);border-color:var(--lineL)}
.ibtn.on{color:var(--onAccent);background:var(--gold);border-color:var(--gold)}
.ibtn.sync{gap:5px}
.ibtn.sync.live{color:var(--tealInk);border-color:rgba(46,196,160,.45)}
.ibtn.sync.sync{color:var(--gold);border-color:rgba(244,181,63,.45)}
.ibtn.sync.off_line,.ibtn.sync.error{color:var(--redInk);border-color:rgba(232,69,92,.45)}
.ibtn.sync .dot{width:5px;height:5px}

/* ---------- bottom nav ---------- */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ink2);border-top:1px solid var(--line);
  padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.bn .in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.bn button{background:none;border:0;padding:7px 2px 6px;border-radius:10px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase}
.bn button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bn button.on{color:var(--gold);background:var(--surface)}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:11px 0}
.card.flat{padding:0;overflow:hidden}
.eyebrow{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700}
h2.sec{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;letter-spacing:.01em;
  margin:20px 0 2px;text-transform:uppercase}
.hint{font-size:11.5px;color:var(--muted);margin:4px 0 0}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips .chip{flex:0 0 auto}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--raised);color:var(--text);border-color:var(--lineL)}
.chip.on[data-sport]{border-color:currentColor}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;
  font-weight:700;font-size:12.5px;color:var(--text)}
.btn:hover{border-color:var(--lineL)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--onAccent)}
.btn.dan{background:transparent;border-color:var(--red);color:var(--redInk)}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:10px;
  font-weight:800;letter-spacing:.07em;text-transform:uppercase;border:1px solid transparent}
.pill.live{background:rgba(232,69,92,.16);color:var(--redInk);border-color:rgba(232,69,92,.4)}
.pill.done{background:rgba(46,196,160,.14);color:var(--tealInk);border-color:rgba(46,196,160,.35)}
.pill.sched{background:var(--raised);color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700;
  text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 7px;border-bottom:1px solid var(--line);font-size:12.5px}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
input[type=text],input[type=number],input[type=password],select{background:var(--ink2);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;width:100%;font-size:13px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label.fl{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px;font-weight:600}

/* ---------- sport accents ---------- */
[data-sp="PB"]{color:var(--gold)}
[data-sp="BM"]{color:var(--teal)}
[data-sp="TT"]{color:var(--red)}
[data-sp="CR"]{color:var(--blue)}
[data-sp="CH"]{color:var(--violet)}
.sptag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}

/* ---------- team swatch ---------- */
.sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.tname{font-weight:600;font-size:13px}

/* ---------- championship ledger (signature) ---------- */
.ledger{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ldg{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ldg-hd{display:grid;grid-template-columns:22px minmax(92px,1.35fr) repeat(5,minmax(30px,.4fr)) 62px;
  gap:0;background:var(--ink2);border-bottom:1px solid var(--line)}
.ldg-hd div{padding:8px 3px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:800;text-align:center}
.ldg-hd div:nth-child(2){text-align:left;padding-left:8px}
.ldg-row{display:grid;grid-template-columns:22px minmax(92px,1.35fr) repeat(5,minmax(30px,.4fr)) 62px;
  border-bottom:1px solid var(--line);align-items:stretch}
.ldg-row:last-child{border-bottom:0}
.ldg-row.me{background:rgba(244,181,63,.06)}
.ldg-pos{display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;
  font-size:16px;color:var(--dim)}
.ldg-row:nth-child(2) .ldg-pos{color:var(--gold)}
.ldg-team{padding:8px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.ldg-team .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldg-bar{height:5px;border-radius:3px;background:var(--raised);display:flex;overflow:hidden}
.ldg-bar i{display:block;height:100%}
.ldg-cell{display:grid;place-items:center;gap:1px;padding:6px 2px;border-left:1px solid var(--line)}
.ldg-cell .rk{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;line-height:1}
.ldg-cell .pt{font-size:8.5px;color:var(--dim);font-weight:600}
.ldg-cell.tbd .rk{color:var(--dim);opacity:.45}
.ldg-tot{display:grid;place-items:center;border-left:1px solid var(--line);background:var(--ink2)}
.ldg-tot{padding:0 4px}
.ldg-tot b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;
  white-space:nowrap}
@media(max-width:420px){
  .ldg-hd,.ldg-row{grid-template-columns:20px minmax(78px,1.2fr) repeat(5,minmax(27px,.36fr)) 56px}
  .ldg-cell .rk{font-size:13px}
  .ldg-cell .pt{font-size:7.5px}
  .ldg-team .nm{font-size:11px}
  .ldg-tot b{font-size:15px}
}
.ldg-tot .pen{display:block;font-size:9px;font-weight:800;color:var(--redInk);margin-top:1px}

/* ---------- printable team sheets (Save as PDF) ---------- */
#printarea{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{background:#fff!important;color:#000!important}
  body>header,body>nav,body>.wrap,body>.toast,body>.ov{display:none!important}
  #printarea{display:block!important;font-size:10pt;line-height:1.35;color:#000}
  #printarea .sheet{page-break-after:always;break-after:page}
  #printarea table.pgt{width:100%;border-collapse:collapse;border:0}
  #printarea table.pgt>thead>tr>td.pghd{border:0;padding:0 0 2px}
  #printarea table.pgt>tbody>tr>td.pgbd{border:0;padding:0}
  #printarea table.pgt>thead{display:table-header-group}
  #printarea .sheet:last-child{page-break-after:auto;break-after:auto}
  #printarea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printarea table,#printarea tr,#printarea td,#printarea th{display:revert}
#printarea table.pgt{width:100%;border-collapse:collapse;border:0}
#printarea table.pgt>thead>tr>td.pghd{border:0;padding:0 0 2px}
#printarea table.pgt>tbody>tr>td.pgbd{border:0;padding:0}
#printarea .phd{display:flex;align-items:center;gap:10px;border-bottom:2px solid #111;padding-bottom:7px;margin-bottom:9px}
#printarea .phd img{height:46px;width:auto}
#printarea .phd h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:20pt;text-transform:uppercase;letter-spacing:.01em}
#printarea .phd .sub{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#555}
#printarea .phd .rt{margin-left:auto;text-align:right;font-size:8pt;color:#555}
#printarea h2{font-family:'Barlow Condensed',sans-serif;font-size:12.5pt;text-transform:uppercase;
  margin:11px 0 4px;border-bottom:1px solid #bbb;padding-bottom:2px;letter-spacing:.02em}
#printarea table{width:100%;border-collapse:collapse;margin-bottom:4px}
#printarea th,#printarea td{border:1px solid #999;padding:3.2px 5px;font-size:8.6pt;text-align:left;vertical-align:top}
#printarea th{background:#eceff4;font-size:7.4pt;letter-spacing:.07em;text-transform:uppercase}
#printarea td.c,#printarea th.c{text-align:center;width:26px}
#printarea .yes{font-weight:700}
#printarea td.bx{height:19px}
#printarea td.wn{font-weight:800}
/* keep a round heading with its own table across a page break, and repeat the
   column headings if a table does have to run over */
#printarea .rnd{break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
#printarea thead{display:table-header-group}
#printarea tr{break-inside:avoid;page-break-inside:avoid}
#printarea table.fxt{table-layout:fixed}
#printarea table.fxt .u{width:50px;font-size:6.2pt;letter-spacing:.02em}
#printarea table.fxt .sc{width:46px}
#printarea table.fxt .rf{width:64px}
#printarea table.fxt .gap{width:16px;border-top:0;border-bottom:0;background:#fff}
#printarea table.fxt td.gap{border-left:0;border-right:0}
#printarea table.fxt .tm{font-size:8.8pt}
#printarea table.fxt td.sc{font-size:11pt;font-weight:800;text-align:center}
#printarea .note.tiny{font-size:7pt;color:#666;margin-top:2px}
/* score margin grid */
#printarea table.mgrid{table-layout:fixed}
#printarea table.mgrid th.v{font-size:6pt;line-height:1.2;vertical-align:bottom;padding:3px 2px;
  white-space:normal;overflow-wrap:normal;word-break:keep-all;hyphens:none;text-align:center;
  letter-spacing:0;text-transform:none}
#printarea table.mgrid td.nm{font-size:7.6pt;font-weight:700;white-space:normal;overflow-wrap:anywhere;
  line-height:1.15;width:82px;vertical-align:middle}
/* two lines' worth of height on every row, whether the name wraps or not */
#printarea table.mgrid tbody td{height:26px;vertical-align:middle}
#printarea table.lu{margin-bottom:7px}
#printarea table.lu thead tr:first-child th{background:#dfe5ef;font-size:7.4pt;text-align:left}
#printarea table.lu td.bx{height:21px}
#printarea table.mgrid th.rowhd{width:82px;white-space:normal}
#printarea table.mgrid td.dg{background:#e9edf4}
#printarea table.mgrid td.c,#printarea table.mgrid th.c{width:38px;font-size:6.2pt;letter-spacing:0}
#printarea table.mgrid td.c{height:20px;font-size:8pt}
#printarea .seed{display:inline-block;border:1px solid #7c8aa5;background:#fff;border-radius:3px;
  padding:0 5px;margin-left:4px;font-size:7pt;font-weight:800;letter-spacing:.04em;color:#1a2942;
  text-transform:none;vertical-align:1px}
#printarea .no{color:#bbb}
#printarea .out td{color:#888;text-decoration:line-through}
#printarea td.plc,#printarea th.plc{text-align:center;font-weight:800;width:44px}
#printarea td.plc{height:17px}
#printarea td.plc.na{background:repeating-linear-gradient(135deg,#f1f1f1 0 4px,#fff 4px 8px)}
#printarea table.squad .w-n{width:22px}
#printarea table.squad .w-sp{width:26px}
#printarea table.squad .w-mw{width:32px}
#printarea .note{font-size:8pt;color:#444;margin:3px 0 0}
#printarea .warn{border:1px solid #b00;background:#fff0f0;padding:5px 7px;font-size:8.4pt;margin:5px 0}
#printarea .okbox{border:1px solid #197a4e;background:#f1fbf5;padding:5px 7px;font-size:8.4pt;margin:5px 0}
#printarea .sign{display:flex;gap:22px;margin-top:16px}
#printarea .sign div{flex:1;border-top:1px solid #666;padding-top:4px;font-size:8pt;color:#444}

/* ---------- score entry mode ---------- */
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 2px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;
  color:var(--muted);font-weight:700;font-size:12.5px;display:flex;flex-direction:column;gap:2px;text-align:left}
.mode small{font-size:9.5px;font-weight:600;color:var(--dim);letter-spacing:.02em}
.mode.on{border-color:var(--gold);color:var(--text);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.mode.on small{color:var(--gold)}
.erow{display:flex;align-items:center;gap:7px;padding:8px 9px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow.done{background:color-mix(in srgb,var(--teal) 6%,transparent)}
.erow .eno{width:34px;flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--dim);
  text-transform:uppercase;line-height:1.15}
.eside{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px}
.eside.b{justify-content:flex-end}
.eside .nm{font-size:12px;line-height:1.2;overflow-wrap:anywhere}
@media(max-width:430px){
  .erow{flex-wrap:wrap;padding:9px}
  .erow .eno{width:100%;order:0;margin-bottom:4px}
  .eside{flex:1 1 34%}
  .emid{order:2;flex:1 1 100%;justify-content:center;margin-top:6px}
  .eopen{order:3;position:absolute;right:8px;top:8px}
  .erow{position:relative}
  .esc{width:40px}
}
.eside.w .nm{font-weight:800}
.eside.l .nm{color:var(--muted)}
.emid{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.esc{width:44px;text-align:center;padding:6px 2px;font-weight:800;font-size:15px;border-radius:8px;
  color:var(--text);background:var(--ink2);border:1px solid var(--line);
  font-family:'Barlow Condensed',sans-serif;-moz-appearance:textfield}
.esc.sm{width:36px;font-size:12px;padding:4px 2px}
.esc::-webkit-outer-spin-button,.esc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.esc.filled{border-color:var(--lineL);background:var(--raised)}
.esep{color:var(--dim);font-size:11px}
.ebd{display:flex;flex-direction:column;gap:3px}
.ebrow{display:flex;align-items:center;gap:3px}
.ebl{font-size:8px;font-weight:800;color:var(--dim);width:14px}
.ech{display:flex;gap:4px}
.eopen{background:none;border:0;color:var(--dim);font-size:19px;cursor:pointer;padding:0 2px;flex:0 0 auto}
.eopen:hover{color:var(--gold)}

/* ---------- collapsible fixture sections ---------- */
.fxsec{border:1px solid var(--line);border-radius:var(--r);margin:9px 0;overflow:hidden;background:var(--surface)}
.fxhd{width:100%;background:var(--ink2);border:0;border-bottom:1px solid transparent;padding:11px 12px;
  display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;color:var(--text)}
.fxsec.open .fxhd{border-bottom-color:var(--line)}
.fxhd .ar{color:var(--dim);font-size:15px;line-height:1;transition:transform .16s;flex:0 0 auto;width:11px}
.fxsec.open .fxhd .ar{transform:rotate(90deg)}
.fxhd .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxhd .cnt{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:var(--muted)}
.fxhd .tm{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.05em;min-width:52px;text-align:right}
.fxhd:hover{background:var(--raised)}
.fxbody{padding:2px 11px 12px}

/* ---------- fixture rows ---------- */
.fx{display:flex;align-items:center;gap:9px;padding:10px 11px;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.fx:last-child{border-bottom:0}
.fx:hover{background:var(--raised)}
.fx .meta{width:54px;flex:0 0 auto;text-align:center;white-space:nowrap}
.fx .meta .ct{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:800}
.fx .meta .tm{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:3px;white-space:nowrap}
.fx .sides{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fx .side{display:flex;align-items:center;gap:7px;min-width:0}
.fx .side .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.fx .side.win .nm{font-weight:700}
.fx .side.lose .nm{color:var(--muted)}
.fx .side .sc{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;min-width:24px;text-align:right}
.fx .st{flex:0 0 auto}

/* ---------- scoreboard ---------- */
.board{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.board .bhd{padding:9px 12px;background:var(--ink2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);font-weight:600}
.bside{padding:13px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bside+.bside{border-top:1px solid var(--line)}
.bside .who .nm{font-size:15px;font-weight:700;line-height:1.2}
.bside .who .pr{font-size:11px;color:var(--muted);margin-top:3px}
.bside .who .pr b{color:var(--text);font-weight:600}
.bnum{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:46px;line-height:.85;min-width:62px;text-align:right}
.bside.srv .bnum{color:var(--gold)}
.tapz{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
.tap{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:15px 10px;cursor:pointer;
  font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tap:active{transform:scale(.98)}
.tap small{font-size:10px;color:var(--dim);font-weight:600}
.phase{display:flex;gap:5px;margin:9px 0}
.phase div{flex:1;border-radius:7px;border:1px solid var(--line);padding:6px 4px;text-align:center;
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.phase div.on{border-color:var(--gold);color:var(--gold);background:rgba(244,181,63,.09)}
.phase div.past{color:var(--muted);opacity:.6}
.alert{border-radius:11px;padding:10px 12px;margin:10px 0;font-size:12.5px;font-weight:600;
  border:1px solid;display:flex;gap:9px;align-items:flex-start}
.alert.warn{border-color:rgba(244,181,63,.45);background:rgba(244,181,63,.09);color:var(--gold)}
.alert.bad{border-color:rgba(232,69,92,.45);background:rgba(232,69,92,.09);color:var(--redInk)}
.alert.ok{border-color:rgba(46,196,160,.4);background:rgba(46,196,160,.09);color:var(--tealInk)}

/* ---------- lineup editor ---------- */
.pairbox{border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0;background:var(--ink2)}
.pairbox .ph{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:7px}
.pl{display:flex;align-items:center;gap:7px;padding:5px 0}
.pl select{flex:1}
.cat{font-size:8.5px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;
  background:var(--raised);color:var(--muted);white-space:nowrap}
.cat.w{background:rgba(167,125,255,.16);color:var(--violet)}
.cat.m{background:rgba(91,147,255,.14);color:var(--blue)}

/* ---------- coverage panel ---------- */
.covrow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.covrow::-webkit-scrollbar{display:none}
.covchip{flex:0 0 auto;border:1px solid var(--line);border-radius:11px;background:var(--ink2);
  padding:8px 12px;text-align:center;min-width:66px}
.covchip b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;line-height:1}
.covchip span{font-size:9px;letter-spacing:.06em;color:var(--dim);font-weight:700}
.covchip.short{border-color:var(--red)}
.covchip.short b{color:var(--redInk)}
.gt{width:100%;border-collapse:collapse}
.gt th,.gt td{padding:6px 4px;font-size:11.5px;text-align:center;border:0}
.gt th{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.gt td:first-child,.gt th:first-child{text-align:left;font-size:10.5px;font-weight:700;white-space:nowrap}
.gt td b{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800}
.gt tr.tot td{border-top:1px solid var(--line);color:var(--gold)}
.gt td.zero b{color:var(--dim);opacity:.5}
.gt td.bad b{color:var(--redInk)}

/* ---------- roster ---------- */
.roster{display:grid;grid-template-columns:1fr;gap:0}
.rp2{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rp2:last-child{border-bottom:0}
.rp2.out{opacity:.5}
.rp2 .who{flex:1 1 150px;min-width:0}
.rp2 .who b{font-weight:600;font-size:13.5px;display:inline-block;vertical-align:middle}
.rp2.out .who b{text-decoration:line-through}
.rp2 .meta2{display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap}
.gsym{font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px}
.gsym.f{background:rgba(232,69,92,.14);color:var(--redInk)}
.gsym.m{background:rgba(91,147,255,.14);color:var(--blue)}
.spx{display:flex;gap:4px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.spb{font-size:10px;font-weight:700;padding:5px 9px;border-radius:8px;border:1px solid var(--line);
  background:var(--ink2);cursor:default;white-space:nowrap}
.spb:not(.on){color:var(--dim)}
.spb.tap{cursor:pointer}
.spb.on{border-color:currentColor;font-weight:800;
  background:color-mix(in srgb,currentColor 15%,transparent)}
.spb.lock{opacity:.3}
.spb.tap:not(.on):not(.lock):hover{border-color:var(--lineL);color:var(--text)}
.spb .lg{display:none}
@media(min-width:720px){.spb .lg{display:inline}.spb .sh{display:none}}
.availb{flex:0 0 auto;border:1px solid var(--line);background:var(--ink2);border-radius:8px;
  padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:.05em;cursor:pointer;color:var(--tealInk)}
.availb.out{color:var(--redInk);border-color:rgba(232,69,92,.4)}
.rp{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.rp:last-child{border-bottom:0}
.rp .n{flex:1;min-width:0}
.rp .n b{font-weight:600;font-size:13px;display:block}
.rp .n span{font-size:10.5px;color:var(--dim)}
.rp .sp{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.spd{font-size:8.5px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;border:1px solid currentColor;
  cursor:pointer;opacity:.28}
.spd.on{opacity:1;background:color-mix(in srgb,currentColor 14%,transparent)}
.owner{font-size:8px;font-weight:800;letter-spacing:.08em;padding:1px 5px;border-radius:4px;
  background:rgba(244,181,63,.16);color:var(--gold)}

/* ---------- referee console ---------- */
.scorestrip{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin:12px 0 10px}
.sTeam{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;position:relative;overflow:hidden}
.sTeam .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.sTeam .nm{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sTeam .num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:46px;line-height:.92;margin-top:1px}
.sTeam.right{text-align:right}
.phasebox{text-align:center;padding:0 3px;min-width:56px}
.phasebox .cv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;color:var(--gold);line-height:1}
.phasebox .cl{font-size:8px;color:var(--dim);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

.court{position:relative;display:grid;grid-template-columns:1fr 6px 1fr;border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);border:3px solid var(--courtLine);margin-bottom:10px;user-select:none}
.half{display:grid;grid-template-rows:1fr 1fr;background:var(--court);position:relative}
.half.b{background:color-mix(in srgb,var(--court) 86%,#fff)}
.net{background:repeating-linear-gradient(0deg,rgba(255,255,255,.95) 0 5px,rgba(255,255,255,.35) 5px 10px)}
.court[data-sport="PB"] .kitchen{position:absolute;top:0;bottom:0;width:19%;z-index:1;
  background:color-mix(in srgb,var(--kitchen) 78%,transparent)}
.court[data-sport="PB"] .half.a .kitchen{right:0;border-left:2px solid var(--courtLine)}
.court[data-sport="PB"] .half.b .kitchen{left:0;border-right:2px solid var(--courtLine)}
.court[data-sport="BM"]{--court:#1f6b45}
.court[data-sport="BM"] .kitchen{position:absolute;top:0;bottom:0;width:26%;z-index:1;
  border-style:solid;border-color:var(--courtLine);border-width:0}
.court[data-sport="BM"] .half.a .kitchen{right:0;border-left-width:2px}
.court[data-sport="BM"] .half.b .kitchen{left:0;border-right-width:2px}
.court[data-sport="TT"]{--court:#12406b;border-radius:8px}
.court[data-sport="TT"] .kitchen{display:none}
.box{position:relative;z-index:2;padding:13px 12px 22px;min-height:98px;display:flex;flex-direction:column;
  justify-content:center;gap:4px;cursor:pointer}
.half .box:first-child{border-bottom:2px solid var(--courtLine)}
.box:hover{background:rgba(255,255,255,.09)}
.box:active{background:rgba(255,255,255,.17)}
.box.locked{cursor:default}.box.locked:hover{background:transparent}
.box.justin{box-shadow:inset 0 0 0 3px var(--teal)}
.posTag{font-size:8.5px;font-weight:800;letter-spacing:.11em;color:rgba(255,255,255,.75);text-transform:uppercase}
.pSlot{display:flex;align-items:center;gap:6px;min-width:0}
.pSlot .sl{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;color:#ffe6a3;flex:0 0 auto}
.pSlot .pn{font-size:14.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pTag{font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.24);color:#fff;flex:0 0 auto}
.servetag{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff59d;margin-top:2px}
.ball{display:inline-flex;flex:0 0 auto}
.taphint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;color:rgba(255,255,255,.6);
  letter-spacing:.07em;text-transform:uppercase;z-index:3;pointer-events:none}
.court.mini{margin:0 0 10px;border-width:2px;box-shadow:none}
.court.mini .box{min-height:60px;padding:8px 9px;gap:2px;cursor:default}
.court.mini .box:hover{background:transparent}
.court.mini .pSlot .pn{font-size:12.5px}
.court.mini .posTag{font-size:8px}
.court.mini .taphint{bottom:2px;font-size:8px}
.court.mini .half{padding-bottom:11px}
.court.mini[data-sport="PB"] .kitchen{background:color-mix(in srgb,var(--kitchen) 52%,transparent)}
.court.mini .net{background:repeating-linear-gradient(0deg,rgba(255,255,255,.98) 0 4px,rgba(255,255,255,.4) 4px 8px)}
.mcwrap{margin:2px 0 4px}
.mclegend{display:flex;align-items:center;gap:6px;justify-content:center;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.mclegend b{color:var(--gold)}

.tossbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;margin-bottom:9px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.ctrlrow{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:8px}
.ctrlrow .tl{flex:1;min-width:0;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--raised);color:var(--text);
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;cursor:pointer;flex:0 0 auto}
.rbtn.plus{border:none;color:var(--onAccent)}
.rbtn:disabled{opacity:.35;cursor:not-allowed}
.endsnote{display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:10.5px;font-weight:700;
  color:var(--dim);margin:-3px 0 10px;flex-wrap:wrap}
.endsnote>span{display:flex;align-items:center;gap:6px}

.rotwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.rothead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.rothead .big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:var(--gold)}
.ladder{display:flex;gap:4px}
.gate{flex:1;min-width:0}
.gate .bar{height:31px;border-radius:7px;background:var(--raised);border:1px solid var(--line);overflow:hidden;position:relative}
.gate .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,rgba(244,181,63,.5),var(--gold));transition:width .25s}
.gate.done .fill{width:100%}
.gate.cur .bar{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,181,63,.22)}
.gate .pair{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);z-index:2}
.gate.done .pair{color:var(--onAccent)}
.gate.cur .pair{color:var(--text)}
.gate .tick{text-align:center;font-size:9px;color:var(--dim);font-weight:700;margin-top:4px}
.gate.cur .tick{color:var(--gold)}
.countdown{margin-top:9px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.countdown b{color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px}

/* ---------- blocking confirmation (§3.4) ---------- */
.subov{position:fixed;inset:0;z-index:120;background:rgba(6,10,18,.76);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:18px}
.subcard{background:var(--surface);border:2px solid var(--teal);border-radius:18px;padding:20px;max-width:470px;
  width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.5);text-align:center}
.subcard.ends{border-color:var(--gold)}
.subgate{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--tealInk);text-transform:uppercase}
.subcard.ends .subgate{color:var(--gold)}
.subpair{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 13px}
.subrow{background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px;text-align:left}
.subteam{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:7px}
.subswap{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
.subswap .tag{font-size:8px;font-weight:800;letter-spacing:.1em;padding:2px 5px;border-radius:4px;margin-right:5px}
.subswap .off{color:var(--dim)}
.subswap .off .tag{background:rgba(232,69,92,.18);color:var(--redInk)}
.subswap .on{color:var(--text)}
.subswap .on .tag{background:rgba(46,196,160,.2);color:var(--tealInk)}
.subswap .on b{color:var(--tealInk)}
.subswap .arrow{color:var(--dim)}
.subnote{font-size:10.5px;color:var(--dim);font-weight:600;margin-top:9px;line-height:1.5}
.bigbtn{width:100%;margin-top:6px;background:var(--teal);color:#08251d;border:none;padding:13px;font-size:13.5px;
  border-radius:11px;font-weight:800;cursor:pointer;font-family:inherit}
.subcard.ends .bigbtn{background:var(--gold);color:var(--onAccent)}
.finalrow{display:flex;align-items:flex-end;justify-content:center;gap:13px;margin-top:13px}
.finalside{flex:1;text-align:center;min-width:0}
.finalside .fnm{font-size:11px;font-weight:700;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.finalin{width:100%;max-width:110px;padding:11px 0;text-align:center;background:var(--ink2);border:2px solid var(--line);
  border-radius:11px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:29px}

/* ---------- stats ---------- */
.mvp{background:linear-gradient(135deg,rgba(244,181,63,.16),rgba(46,196,160,.08));border:1px solid var(--gold);
  border-radius:16px;padding:18px;text-align:center;margin-bottom:13px}
.mvpn{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1.05;margin-top:3px}
.mvpt{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:3px}
.mvpstats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}
.mvpstats div{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 4px}
.mvpstats b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px}
.mvpstats span{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700}
@media(max-width:560px){.mvpstats{grid-template-columns:repeat(2,1fr)}.mvpn{font-size:25px}}
@media(max-width:680px){.ctrls{grid-template-columns:1fr}.sTeam .num{font-size:38px}
  .box{min-height:92px;padding:11px 9px 21px}.pSlot .pn{font-size:13px}
  .subswap{flex-direction:column;align-items:flex-start;gap:5px}}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:90;background:rgba(6,10,18,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.md{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;padding:16px 15px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media(min-width:640px){.ov{align-items:center;padding:20px}.md{border-radius:16px}}
.md h3{margin:0 0 3px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;text-transform:uppercase}

/* ---------- misc ---------- */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;line-height:1}
.stat span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.rules h4{margin:16px 0 5px;font-size:13.5px;font-weight:700}
.rules p,.rules li{font-size:12.5px;color:var(--muted);margin:5px 0}
.rules ul{padding-left:18px;margin:5px 0}
.rules b{color:var(--text)}
.acc{border:1px solid var(--line);border-radius:11px;margin:8px 0;overflow:hidden;background:var(--surface)}
.acc>button{width:100%;background:none;border:0;padding:12px 13px;display:flex;align-items:center;gap:9px;
  cursor:pointer;text-align:left;font-weight:700;font-size:13.5px}
.acc>button .ar{margin-left:auto;color:var(--dim);transition:transform .18s}
.acc.open>button .ar{transform:rotate(90deg)}
.acc .body{padding:0 13px 13px;display:none}
.acc.open .body{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:95;background:var(--raised);
  border:1px solid var(--lineL);border-radius:10px;padding:9px 15px;font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>
</head>

/* ---------- fixture generation ---------- */
const RR4 = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];   // 4-team round robin, 3 rounds

function rr8(ids){                                          // circle method, 7 rounds x 4
  const fixed=ids[0]; let rest=ids.slice(1); const rounds=[];
  for(let r=0;r<7;r++){
    const md=[[fixed,rest[0]]];
    for(let i=1;i<=3;i++) md.push([rest[i],rest[7-i]]);
    rounds.push(md);
    rest=[rest[rest.length-1]].concat(rest.slice(0,rest.length-1));
  }
  return rounds;
}
const addMin=(hhmm,m)=>{const [h,mi]=hhmm.split(':').map(Number);const t=h*60+mi+m;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};

function buildFixtures(teams){
  const byPos={}; teams.forEach(t=>byPos[t.pos]=t.id);
  const out=[];
  SPORTS.forEach(s=>{
    if(s.kind==='racket'){
      const g={A:DRAWS[s.k].A.map(n=>byPos[n]), B:DRAWS[s.k].B.map(n=>byPos[n])};
      RR4.forEach((rd,ri)=>{
        let c=0;
        ['A','B'].forEach(gk=>rd.forEach(pr=>{
          c++;
          out.push({id:s.k+'-g'+ri+'-'+c, sport:s.k, stage:'group', grp:gk, round:ri+1,
            court:c, time:addMin(s.start, ri*s.slot),
            a:g[gk][pr[0]], b:g[gk][pr[1]], log:[], lineup:{}, pos:{}, server:'a', acked:[], done:false});
        }));
      });
      const mk=(id,stage,round,court,label)=>({id:s.k+'-'+id, sport:s.k, stage:stage, round:round,
        court:court, time:addMin(s.start, round*s.slot), a:null, b:null, label:label,
        log:[], lineup:{}, pos:{}, server:'a', acked:[], done:false});
      out.push(mk('sf1','sf',3,1,'Semi-Final 1 · A1 v B2'));
      out.push(mk('sf2','sf',3,2,'Semi-Final 2 · B1 v A2'));
      out.push(mk('third','third',4,1,'3rd Place Play-off'));
      out.push(mk('final','final',4,2,'Final'));
    } else {
      const ids=[1,2,3,4,5,6,7,8].map(n=>byPos[n]);
      rr8(ids).forEach((rd,ri)=>rd.forEach((pr,mi)=>{
        const base={id:s.k+'-r'+(ri+1)+'-'+(mi+1), sport:s.k, stage:'league', round:ri+1,
          court:mi+1, time:addMin(s.start, ri*s.slot), a:pr[0], b:pr[1], done:false};
        if(s.k==='CR') Object.assign(base,{boards:[{a:null,b:null},{a:null,b:null}], pairs:{}});
        else Object.assign(base,{result:null, players:{}});
        out.push(base);
      }));
    }
  });
  return out;
}

/* ============================ AVAILABILITY ============================ */
/* A player marked unavailable on match day drops out of every nomination and
   is left out of every count, quota and warning until they are marked back in. */
const isOut  = (tid,pid) => !!(state.avail[tid] && state.avail[tid][pid]===false);
const isIn   = (tid,pid) => !isOut(tid,pid);
/* Squad listing order: the men by grade, then the women together with the
   Women Marquee at the head of them. On the auction sheet the Women Marquee sat
   between the men's marquees and General A, which split the women across the
   list and made "who can cover this sport" harder to read on paper. */
const SQUAD_ORDER = {MPB:0, MTT:1, MBM:2, GA:3, GB:4, WM:5, WG:6};
const bySquadOrder = list => list.slice().sort((x,y)=>
  (SQUAD_ORDER[x.cat]-SQUAD_ORDER[y.cat]) || (list.indexOf(x)-list.indexOf(y)));
const squadIn  = t => bySquadOrder(t.players.filter(p=>isIn(t.id,p.id)));
const squadOut = t => bySquadOrder(t.players.filter(p=>isOut(t.id,p.id)));
const rosterOrder = t => squadIn(t).concat(squadOut(t));

function setAvail(tid,pid,ok){
  state.avail[tid]=state.avail[tid]||{};
  if(ok) delete state.avail[tid][pid]; else state.avail[tid][pid]=false;
  if(!ok) SPORT_ORDER.forEach(sk=>{                 // drop them from every nomination
    const arr=state.nom[tid][sk], i=arr.indexOf(pid); if(i>=0) arr.splice(i,1); });
}

/* ============================ NOMINATIONS ============================ */
const nomOf = (tid,sk) => (state.nom[tid] && state.nom[tid][sk]) || [];
const sportsOfPlayer = (tid,pid) => SPORT_ORDER.filter(k=>nomOf(tid,k).includes(pid));
/* §3.1 — the sole-woman exception counts women who are actually available. */
const soleWoman = tid => squadIn(teamById(tid)).filter(p=>p.g==='F').length<=1;

/* The minimum squad that can cover the whole league is 9 men + 1 woman: the
   three racket sports need 5 men each (15 man-slots) plus Carrom's 2 and Chess's
   1, and every man is capped at two sports — 9 men give exactly 18. The one
   woman covers the compulsory woman in all three racket sports under the
   sole-woman exception. Below 9 men a team cannot field everything, so a Men
   General B player may take a third sport, with the Sports Committee's and the
   opponent's approval. The cap on every other man stays absolute. */
const MIN_MEN = 9, MIN_WOMEN = 1;
const menAvailable = tid => squadIn(teamById(tid)).filter(p=>p.g==='M').length;
const shortOfMen   = tid => menAvailable(tid) < MIN_MEN;
const thirdSportAllowed = (tid,pid) => { const p=pOf(pid);
  if(!p) return false;
  if(p.g==='F') return soleWoman(tid);
  return p.cat==='GB' && shortOfMen(tid);
};
const capFor = (tid,pid) => thirdSportAllowed(tid,pid) ? 3 : 2;
/* A third sport taken under the shortage rule has to be signed off, so it is
   flagged wherever the squad is checked rather than passing silently. */
const needsApproval = (tid,pid) => { const p=pOf(pid);
  return !!(p && p.g==='M' && p.cat==='GB' && shortOfMen(tid)
            && sportsOfPlayer(tid,pid).length>2); };
const nomBy = (tid,sk,g) => nomOf(tid,sk).filter(pid=>pOf(pid).g===g).length;

/* §3.1 quotas — racket sports take 5 men + 1 woman compulsory and may add
   one more of each, so a nominated squad is capped at 6 men and 2 women.
   Carrom and Chess are gender-neutral. */
function toggleNom(tid,sk,pid){
  const arr=state.nom[tid][sk], i=arr.indexOf(pid), s=SP[sk], p=pOf(pid);
  if(i>=0){ arr.splice(i,1); return null; }
  if(isOut(tid,pid)) return pName(pid)+' is marked unavailable for match day.';
  if(arr.length>=s.max) return 'Only '+s.max+' can be nominated for '+s.name+'.';
  if(s.kind==='racket'){
    if(p.g==='M' && nomBy(tid,sk,'M')>=s.maxM)
      return s.name+' already has '+s.maxM+' men — 5 compulsory plus 1 optional.';
    if(p.g==='F' && nomBy(tid,sk,'F')>=s.maxF)
      return s.name+' already has '+s.maxF+' women — 1 compulsory plus 1 optional.';
  }
  if(sportsOfPlayer(tid,pid).length>=capFor(tid,pid))
    return pName(pid)+' is already in '+capFor(tid,pid)+' sports — that is the cap.';
  arr.push(pid); return null;
}
/* Why a sport button is locked for this player, or '' if it can be tapped. */
function nomBlock(tid,sk,pid){
  if(nomOf(tid,sk).includes(pid)) return '';
  const s=SP[sk], p=pOf(pid);
  if(isOut(tid,pid)) return 'unavailable';
  if(nomOf(tid,sk).length>=s.max) return 'full';
  if(s.kind==='racket'){
    if(p.g==='M' && nomBy(tid,sk,'M')>=s.maxM) return 'men full';
    if(p.g==='F' && nomBy(tid,sk,'F')>=s.maxF) return 'women full';
  }
  if(sportsOfPlayer(tid,pid).length>=capFor(tid,pid)) return 'sport cap';
  return '';
}

/* Fill a legal set of nominations from the available squad.
   Compulsory slots first — Chess and Carrom are easy to starve if the three
   racket sports take their optional depth before the board games are covered. */
function autoNominate(tid){
  const t=teamById(tid), n={PB:[],BM:[],TT:[],CR:[],CH:[]};
  const pool=squadIn(t);
  const cnt={}; pool.forEach(p=>cnt[p.id]=0);
  const R=['PB','TT','BM'];

  const fits=(pid,sk)=>{
    if(!pid||cnt[pid]===undefined||n[sk].includes(pid)) return false;
    const s=SP[sk], g=pOf(pid).g;
    if(n[sk].length>=s.max) return false;
    if(s.kind==='racket'){
      if(g==='M' && n[sk].filter(x=>pOf(x).g==='M').length>=s.maxM) return false;
      if(g==='F' && n[sk].filter(x=>pOf(x).g==='F').length>=s.maxF) return false;
    }
    return cnt[pid]<capFor(tid,pid);
  };
  const put=(pid,sk)=>{ if(!fits(pid,sk)) return false; n[sk].push(pid); cnt[pid]++; return true; };
  const cat=c=>pool.filter(p=>p.cat===c).map(p=>p.id);
  const freest=list=>list.slice().sort((x,y)=>cnt[x]-cnt[y]);
  const men=()=>freest(pool.filter(p=>p.g==='M').map(p=>p.id));
  const women=()=>freest(pool.filter(p=>p.g==='F').map(p=>p.id));

  // 1 · board games first — Chess needs 1, Carrom 2, both gender-neutral. Staff
  //     them from whichever gender has slack, so a short bench of men is not
  //     spent on Carrom while a racket sport still needs its compulsory five.
  const genderSlack=g=>{
    const need=R.reduce((s,sk)=>s+Math.max(0,(g==='M'?SP[sk].minM-nomByList(n[sk],'M')
                                                     :SP[sk].minF-nomByList(n[sk],'F'))),0);
    const room=pool.filter(p=>p.g===g).reduce((s,p)=>s+(capFor(tid,p.id)-cnt[p.id]),0);
    return room-need;
  };
  const weak={GB:0,WG:1,GA:2,WM:3,MPB:4,MTT:4,MBM:4};
  const boardPick=sk=>{
    const cand=pool.filter(p=>fits(p.id,sk))
      .sort((x,y)=> genderSlack(y.g)-genderSlack(x.g) || weak[x.cat]-weak[y.cat]
                    || (capFor(tid,y.id)-cnt[y.id])-(capFor(tid,x.id)-cnt[x.id]));
    return cand.length?put(cand[0].id,sk):false;
  };
  while(n.CH.length<SP.CH.min && boardPick('CH')){}
  while(n.CR.length<SP.CR.min && boardPick('CR')){}

  // 2 · each marquee anchors his own sport
  put((cat('MPB')[0]),'PB'); put((cat('MTT')[0]),'TT'); put((cat('MBM')[0]),'BM');

  // 3 · one woman into every racket sport (compulsory), spread before doubling up
  R.forEach(sk=>{ if(nomByList(n[sk],'F')) return;
    women().forEach(pid=>{ if(!nomByList(n[sk],'F')) put(pid,sk); }); });

  // 4 · five men into every racket sport (compulsory). Filled a slot at a time,
  //     always serving the sport that is furthest short with the man who has the
  //     most room left — filling one sport to the brim first can strand another.
  const order=[].concat(cat('MPB'),cat('MTT'),cat('MBM'),cat('GA'),cat('GB'));
  const strength=pid=>{ const i=order.indexOf(pid); return i<0?99:i; };
  for(let guard=0; guard<60; guard++){
    const short=R.filter(sk=>nomByList(n[sk],'M')<SP[sk].minM)
                 .sort((x,y)=>nomByList(n[x],'M')-nomByList(n[y],'M'));
    if(!short.length) break;
    const sk=short[0];
    const cand=pool.filter(p=>p.g==='M'&&fits(p.id,sk))
                   .sort((x,y)=>(capFor(tid,y.id)-cnt[y.id])-(capFor(tid,x.id)-cnt[x.id])
                                || strength(x.id)-strength(y.id));
    if(!cand.length) break;
    put(cand[0].id,sk);
  }

  // 5 · optional depth — a 6th man and a 2nd woman per racket sport, then the
  //     board games. Every optional pick is rolled back if it would leave another
  //     sport unable to reach its compulsory number with the players left.
  const drop=(pid,sk)=>{ const i=n[sk].indexOf(pid); if(i<0) return; n[sk].splice(i,1); cnt[pid]--; };
  const compulsoryReachable=()=>{
    const spare={}; pool.forEach(p=>spare[p.id]=capFor(tid,p.id)-cnt[p.id]);
    return R.every(sk=>{
      let need=SP[sk].minM-nomByList(n[sk],'M');
      if(need<=0) return true;
      const cand=pool.filter(p=>p.g==='M'&&!n[sk].includes(p.id)&&spare[p.id]>0)
                     .sort((x,y)=>spare[y.id]-spare[x.id]);
      cand.forEach(p=>{ if(need>0){ spare[p.id]--; need--; } });
      return need<=0;
    });
  };
  const optPut=(pid,sk)=>{ if(!put(pid,sk)) return false;
    if(!compulsoryReachable()){ drop(pid,sk); return false; } return true; };

  R.forEach(sk=>{ order.concat(men()).forEach(pid=>optPut(pid,sk));
                  women().forEach(pid=>optPut(pid,sk)); });
  freest(pool.map(p=>p.id)).forEach(pid=>{ optPut(pid,'CR'); });
  freest(pool.map(p=>p.id)).forEach(pid=>{ optPut(pid,'CH'); });

  // 6 · nobody available sits out the whole league
  pool.forEach(p=>{ if(cnt[p.id]) return;
    ['CR','CH'].concat(R).forEach(sk=>{ if(!cnt[p.id]) put(p.id,sk); }); });

  state.nom[tid]=n;
}
const nomByList = (list,g) => list.filter(pid=>pOf(pid).g===g).length;

function nomIssues(tid){
  const t=teamById(tid), out=[];
  SPORT_ORDER.forEach(sk=>{
    const s=SP[sk], list=nomOf(tid,sk);
    if(s.kind==='racket'){
      const men=nomBy(tid,sk,'M'), wom=nomBy(tid,sk,'F');
      if(men<s.minM) out.push(s.name+': '+men+' of '+s.minM+' compulsory men nominated');
      if(wom<s.minF) out.push(s.name+': no woman nominated — one must be on court at all times');
    } else if(list.length<s.min){
      out.push(s.name+': '+list.length+' of '+s.min+' compulsory nominated');
    }
  });
  squadIn(t).forEach(p=>{
    const n=sportsOfPlayer(tid,p.id).length;
    if(n===0) out.push(p.name+' is not nominated for any sport');
    if(n>capFor(tid,p.id)) out.push(p.name+' is in '+n+' sports (cap '+capFor(tid,p.id)+')');
  });
  return out;
}

/* ============================ PARTICIPATION (§3.1) ============================
   "Everyone plays at least once" is judged on court time, not on the team sheet:
   a player counts as having played once they are named in a line-up, a Carrom
   pair or a Chess round for a match that has actually started. */
function playedSports(tid,pid){
  const out={};
  state.matches.forEach(m=>{
    if(m.a!==tid&&m.b!==tid) return;
    const started = SP[m.sport].kind==='racket' ? !!(m.log&&m.log.length) : (isPlayed(m)||isLive(m));
    if(!started) return;
    if(SP[m.sport].kind==='racket'){
      if((((m.lineup||{})[tid])||[]).indexOf(pid)>=0) out[m.sport]=1;
    } else if(m.sport==='CR'){
      const pr=(m.pairs||{})[tid]||{};
      Object.keys(pr).forEach(k=>{ if((pr[k]||[]).indexOf(pid)>=0) out.CR=1; });
    } else if(m.sport==='CH'){
      if(((m.players||{})[tid])===pid) out.CH=1;
    }
  });
  return Object.keys(out);
}
const hasPlayed = (tid,pid) => playedSports(tid,pid).length>0;

/* True once none of a player's nominated sports has any match left for this
   team — at that point "not yet played" has become "never played". */
function chancesLeft(tid,pid){
  const mine=sportsOfPlayer(tid,pid);
  /* A knockout slot with no teams drawn yet is still a chance — the team may
     qualify — so an unplayed match with a TBD side counts in that player's
     favour. Nobody is called out for a breach while a route to court remains. */
  const open=m=>!isPlayed(m)&&(m.a===tid||m.b===tid||!m.a||!m.b);
  if(!mine.length) return state.matches.some(open);
  return state.matches.some(m=>mine.indexOf(m.sport)>=0&&open(m));
}

function participation(tid){
  const t=teamById(tid), pool=squadIn(t);
  const played=[], waiting=[], breach=[];
  pool.forEach(p=>{
    if(hasPlayed(tid,p.id)) played.push(p);
    else if(chancesLeft(tid,p.id)) waiting.push(p);
    else breach.push(p);
  });
  const unnamed=pool.filter(p=>!sportsOfPlayer(tid,p.id).length);
  return {played:played, waiting:waiting, breach:breach, unnamed:unnamed, squad:pool.length};
}

/* ---------- penalties ---------- */
const PEN_PER_PLAYER = 500;                 // v5.0 §3.1 — per available player who never took the court
const penOf  = tid => (state.pen[tid]&&Number(state.pen[tid].pts))||0;
const penNote= tid => (state.pen[tid]&&state.pen[tid].note)||'';
function setPen(tid,pts,note){
  pts=Math.max(0,Math.round(Number(pts)||0));
  if(!pts) delete state.pen[tid]; else state.pen[tid]={pts:pts, note:note||''};
  save();
}

/* ============================ SHORT-HANDED PLAY ============================
   A team that cannot field the compulsory six has three ways out, in the order
   a captain should try them:

   1. Give a Men General B player a third sport (see MIN_MEN above).
   2. Play short, with a handicap. Two pairs instead of three and the opponent
      starts at 7; one pair and the opponent starts at 14. The short side still
      has to reach 25, so its pairs cover the whole climb.
   3. Forfeit the sport, and the opponent takes it 25-0.

   The handicap is held as a head start, which means every gate, rotation and
   table downstream keeps working off one number — the running score. A side
   given a 7-point start is already past the first rotation, so its opponent's
   two pairs come on as Pair B and Pair C, which is exactly right. */
const headOf = m => (m.head&&(m.head.a||m.head.b)) ? {a:m.head.a||0, b:m.head.b||0} : {a:0,b:0};
const pairsFor = (m,key) => { const h=headOf(m)[otherK(key)]; return h>=GATE2?1:(h>=GATE1?2:3); };
const shortSide = m => { const h=headOf(m); return h.a?'b':(h.b?'a':null); };
const ffOf = m => m.ff||null;                       // the side that forfeited
const ffWinner = m => m.ff ? (m.ff===m.a?'b':'a') : null;

/* ============================ RACKET SCORING ============================ */
const scoreOf = m => { const h=headOf(m); const s={a:h.a,b:h.b};
  (m.log||[]).forEach(w=>s[w]++); return s; };
const leadOf  = m => { const s=scoreOf(m); return Math.max(s.a,s.b); };
const pairIdx = lead => lead<GATE1?0:(lead<GATE2?1:2);
const PAIR_LABEL=['Pair A','Pair B','Pair C'];
const PAIR_RANGE=['0–'+GATE1, GATE1+'–'+GATE2, GATE2+'–'+TARGET];
const overOf  = m => { const s=scoreOf(m); return s.a>=TARGET||s.b>=TARGET; };
const otherK  = k => k==='a'?'b':'a';
const needFor = (m,tid) => pairsFor(m, tid===m.a?'a':'b')*2;
const lineupReady = m => !!(m.a&&m.b&&m.lineup&&!m.ff
  &&(m.lineup[m.a]||[]).filter(Boolean).length===needFor(m,m.a)
  &&(m.lineup[m.b]||[]).filter(Boolean).length===needFor(m,m.b));
function racketWinner(m){ if(!m.a||!m.b) return null; const s=scoreOf(m);
  if(s.a>=TARGET) return 'a'; if(s.b>=TARGET) return 'b'; return null; }

/* The men's marquee for this sport — he closes the match in Pair C. */
const MARQ_CAT = {PB:'MPB', TT:'MTT', BM:'MBM'};
const marqueeOf = (tid,sport) => { const c=MARQ_CAT[sport]; if(!c) return null;
  const p=(teamById(tid)||{players:[]}).players.find(x=>x.cat===c && isIn(tid,x.id));
  return p?p.id:null; };

function lineupIssues(m,tid){
  if(m.ff) return m.ff===tid?['Sport forfeited — no line-up needed']:[];
  const l=(m.lineup&&m.lineup[tid])||[], out=[];
  const set=l.filter(Boolean);
  const need=needFor(m,tid), pairs=need/2;
  /* a short side enters late — two pairs come on as B and C, one pair as C —
     so its players sit in the last slots and the earlier ones stay empty */
  const first=3-pairs;
  if(set.length<need) return ['Pick all '+need+' player'+(need===1?'':'s')+
    (pairs<3?' — '+pairs+' pair'+(pairs===1?'':'s')+', starting at '+PAIR_LABEL[first]:'')];
  if(new Set(set).size!==need) out.push('A player is listed twice');
  for(let i=0;i<first*2;i++) if(l[i]) out.push('Playing short — leave '+PAIR_LABEL[Math.floor(i/2)]+' empty');
  const nom=nomOf(tid,m.sport);
  set.forEach(pid=>{
    if(isOut(tid,pid)) out.push(pName(pid)+' is marked unavailable');
    else if(!nom.includes(pid)) out.push(pName(pid)+' is not nominated for '+SP[m.sport].name); });
  if(!set.some(pid=>pOf(pid).g==='F')) out.push('At least one woman must be on court');
  [[0,1],[2,3],[4,5]].forEach((pr,i)=>{
    if(l[pr[0]]&&l[pr[1]]&&pOf(l[pr[0]]).g==='F'&&pOf(l[pr[1]]).g==='F')
      out.push(PAIR_LABEL[i]+' is two women — each woman needs a male partner');
  });
  const mq=marqueeOf(tid,m.sport);
  if(mq && set.includes(mq) && l[4]!==mq && l[5]!==mq)
    out.push(pName(mq)+' is the '+SP[m.sport].name+' marquee — he closes the match in Pair C');
  return out;
}

/* Which of a pair's two players starts on the right in that phase.
   §5.1 — the incoming pair chooses its starting server, so this is the
   referee's to set at each rotation and it locks once the phase is under way. */
const rightOf = (m,tid,ph) => ((((m.pos||{})[tid])||[])[ph] ? 1 : 0);
/* The playing-six slot index for a team's court position in a phase. */
const slotAt = (ph,which) => ph*2+which;

/* Walk the rally log, tracking the pair on court, their left/right positions and
   who is serving. Calling with a callback replays every rally in order; calling
   without one just returns the state after the last rally. */
function walkMatch(m,cb){
  const model=SERVE_MODEL[m.sport]||'sideout', first=m.server||'a', ready=lineupReady(m);
  const slot={}; let ph=0;
  const setPhase=p=>{ ph=p; [m.a,m.b].forEach(t=>{ const r=rightOf(m,t,p); slot[t]={R:r,L:1-r}; }); };
  setPhase(0);
  let serving=first; const score={a:0,b:0};
  /* Table tennis: the box is always the right one; the four-way rotation is
     driven by turn = every 2 cumulative points. Turn 0 A, 1 C, 2 B, 3 D. */
  const ttTurn=()=>Math.floor((score.a+score.b)/2)%4;
  const servePos=()=>{ const c=score.a+score.b;
    return model==='alt2' ? 'R' : ((score[serving]%2===0)?'R':'L'); };
  /* Which of the serving pair delivers it — for table tennis the first server's
     partner takes over on turn 2, and the receiver's partner on turn 3. */
  const serveWhich=()=>model==='alt2' ? (ttTurn()<2?'R':'L') : servePos();
  const settle=()=>{ if(model==='alt2') serving=(ttTurn()%2===0)?first:otherK(first); };
  settle();
  (m.log||[]).forEach(w=>{
    settle();
    const pos=servePos(), which=serveWhich(), servTid=serving==='a'?m.a:m.b;
    if(cb){
      const onCourt={};
      [m.a,m.b].forEach(t=>{ const L=(m.lineup||{})[t];
        onCourt[t]= L ? [L[slotAt(ph,slot[t].R)],L[slotAt(ph,slot[t].L)]] : [null,null]; });
      cb({w:w, phase:ph, servingKey:serving, servingPos:pos, servingWhich:which, onCourt:onCourt,
          serverPid: ready ? m.lineup[servTid][slotAt(ph,slot[servTid][which])] : null,
          lead:Math.max(score.a,score.b)});
    }
    const wasServing=(serving===w);
    score[w]++;
    if(model==='sideout'){
      if(wasServing){ const s=slot[w==='a'?m.a:m.b], t=s.R; s.R=s.L; s.L=t; }
      else serving=w;
    }
    const np=pairIdx(Math.max(score.a,score.b));
    if(np!==ph) setPhase(np);
  });
  settle();
  return {slot:slot, phase:ph, serving:serving, pos:servePos(), which:serveWhich(),
          turn:ttTurn(), score:score, model:model};
}
const courtState = m => walkMatch(m,null);

/* A rotation the referee has not yet confirmed. Scoring is locked until they do,
   which is what keeps the app in step with the players actually on court (§3.4). */
const gateOf = lead => lead>=GATE2?GATE2:(lead>=GATE1?GATE1:0);
function subPending(m){
  if(!lineupReady(m)||overOf(m)) return 0;
  const g=gateOf(leadOf(m)); if(!g) return 0;
  return ((m.acked||[]).indexOf(g)>=0) ? 0 : g;
}
/* If points are undone back below a rotation, that rotation must be confirmed again. */
function pruneAcks(m){ const lead=leadOf(m); m.acked=(m.acked||[]).filter(g=>lead>=g); }

function addPoint(m,side){
  if(overOf(m)) return;
  if(subPending(m)) return;                 // confirm the rotation first
  m.log=(m.log||[]).concat([side]);
  pruneAcks(m);
  if(overOf(m)) m.done=true;
  syncKnockouts(); save();
}
function undoPoint(m){ if(!(m.log||[]).length) return; m.log=m.log.slice(0,-1); m.done=false;
  pruneAcks(m); syncKnockouts(); save(); }

/* ============================ RALLY STATS ============================ */
/* Every rally is credited to the two players actually on court for it, replayed
   from the log. Matches recorded with Final score only are excluded — there is no
   rally-by-rally record to attribute. Feeds the §12 Sport MVP award. */
function rallyStats(sportFilter){
  const P={}, PR={};
  TEAMS.forEach(t=>t.players.forEach(p=>{
    P[p.id]={p:p,team:t,won:0,lost:0,serves:0,servePts:0,cw:0,cl:0,matches:{}}; }));
  let withLineups=0, total=0;
  state.matches.forEach(m=>{
    if(SP[m.sport].kind!=='racket') return;
    if(sportFilter&&sportFilter!=='all'&&m.sport!==sportFilter) return;
    if(!m.a||!m.b||!(m.log||[]).length) return;
    total++; if(!lineupReady(m)) return; withLineups++;
    walkMatch(m,ev=>{
      const winTid=ev.w==='a'?m.a:m.b, loseTid=ev.w==='a'?m.b:m.a, clutch=ev.lead>=CLUTCH_FROM;
      ev.onCourt[winTid].forEach(pid=>{ const r=P[pid]; if(!r) return;
        r.won++; r.matches[m.id]=1; if(clutch) r.cw++; });
      ev.onCourt[loseTid].forEach(pid=>{ const r=P[pid]; if(!r) return;
        r.lost++; r.matches[m.id]=1; if(clutch) r.cl++; });
      const sv=P[ev.serverPid];
      if(sv){ sv.serves++; if((ev.servingKey==='a'?m.a:m.b)===winTid) sv.servePts++; }
      [[winTid,1],[loseTid,0]].forEach(x=>{
        const ids=ev.onCourt[x[0]].slice().sort(); if(!ids[0]||!ids[1]) return;
        const k=ids.join('|');
        if(!PR[k]) PR[k]={ids:ids, team:teamById(x[0]), won:0, lost:0};
        x[1]?PR[k].won++:PR[k].lost++;
      });
    });
  });
  const fin=o=>{ o.rallies=o.won+o.lost; o.diff=o.won-o.lost;
    o.rate=o.rallies?Math.round(o.won/o.rallies*1000)/10:0; return o; };
  const players=Object.keys(P).map(k=>fin(P[k])).filter(o=>o.rallies>0).map(o=>{
    o.played=Object.keys(o.matches).length;
    o.hold=o.serves?Math.round(o.servePts/o.serves*1000)/10:0;
    o.cdiff=o.cw-o.cl; return o; });
  return {players:players, pairs:Object.keys(PR).map(k=>fin(PR[k])),
          withLineups:withLineups, total:total};
}

/* ============================ RESULTS (ALL SPORTS) ============================ */
function carromAgg(m){ const s={a:0,b:0};
  (m.boards||[]).forEach(b=>{ if(b&&b.a!=null&&b.b!=null){ s.a+=Number(b.a)||0; s.b+=Number(b.b)||0; } });
  return s; }
const carromPlayed = m => (m.boards||[]).every(b=>b&&b.a!=null&&b.b!=null);

function resultOf(m){                       // 'a' | 'b' | 'd' | null
  if(m.ff) return ffWinner(m);
  const s=SP[m.sport];
  if(s.kind==='racket'){ return racketWinner(m); }
  if(m.sport==='CR'){ if(!carromPlayed(m)) return null;
    const g=carromAgg(m); return g.a>g.b?'a':(g.b>g.a?'b':'d'); }
  return m.result||null;
}
const isPlayed = m => resultOf(m)!==null;
function scoreText(m){
  const s=SP[m.sport];
  if(m.ff){ const w=ffWinner(m);
    if(s.kind==='racket') return w==='a'?[TARGET,0]:[0,TARGET];
    if(m.sport==='CR')    return w==='a'?[FF_CARROM,0]:[0,FF_CARROM];
    return w==='a'?['2','0']:['0','2'];
  }
  if(s.kind==='racket'){ const x=scoreOf(m);
    return (m.log&&m.log.length)||shortSide(m)?[x.a,x.b]:['','']; }
  if(m.sport==='CR'){ const g=carromAgg(m); return carromPlayed(m)?[g.a,g.b]:['',''] ; }
  const r=m.result; if(!r) return ['',''];
  return r==='d'?['1','1']:(r==='a'?['2','0']:['0','2']);
}
const FF_CARROM = 25;      // a walkover board score, so the tables have a figure to work with
const isLive = m => { const s=SP[m.sport];
  if(m.ff) return false;
  if(s.kind==='racket') return !!(m.log&&m.log.length) && !overOf(m);
  if(m.sport==='CR') return (m.boards||[]).some(b=>b&&(b.a!=null||b.b!=null)) && !carromPlayed(m);
  return false; };

/* ============================ STANDINGS ============================ */
function blankRow(tid){ return {tid:tid,p:0,w:0,d:0,l:0,pf:0,pa:0,pts:0}; }

function groupTable(sportKey,grp){
  const s=SP[sportKey], rows={};
  const ms=state.matches.filter(m=>m.sport===sportKey&&m.stage==='group'&&m.grp===grp);
  ms.forEach(m=>{ [m.a,m.b].forEach(t=>{ if(t&&!rows[t]) rows[t]=blankRow(t); }); });
  ms.forEach(m=>{ const r=resultOf(m); if(!r) return;
    const t=scoreText(m), sc={a:Number(t[0])||0, b:Number(t[1])||0};
    const A=rows[m.a], B=rows[m.b];
    A.p++;B.p++; A.pf+=sc.a;A.pa+=sc.b; B.pf+=sc.b;B.pa+=sc.a;
    if(r==='a'){A.w++;A.pts+=2;B.l++;} else {B.w++;B.pts+=2;A.l++;}
  });
  return sortTable(Object.values(rows), ms);
}

function h2h(rows,ms){                      // mini-table between the tied teams only
  const ids=rows.map(r=>r.tid), sub={};
  ids.forEach(i=>sub[i]={w:0,diff:0});
  ms.forEach(m=>{ if(!ids.includes(m.a)||!ids.includes(m.b)) return; const r=resultOf(m); if(!r) return;
    const sc=m.sport==='CR'?carromAgg(m):scoreOf(m);
    sub[m.a].diff+=sc.a-sc.b; sub[m.b].diff+=sc.b-sc.a;
    if(r==='a')sub[m.a].w++; else if(r==='b')sub[m.b].w++; });
  return sub;
}
/* Order within a sport (§2.8, revised): wins first — which is what the table
   points measure, since every team in a group plays the same number of matches —
   then point difference, then the head-to-head result between the teams still
   level, then points scored, then lots.
   Difference sits ahead of head-to-head deliberately: it rewards the margin a
   team built across the whole group rather than one result on the day. */
function sortTable(rows,ms){
  const buckets={}; rows.forEach(r=>{ (buckets[r.pts]=buckets[r.pts]||[]).push(r); });
  let out=[];
  Object.keys(buckets).map(Number).sort((a,b)=>b-a).forEach(k=>{
    const g=buckets[k];
    if(g.length>1){
      g.sort((x,y)=>{
        const dx=x.pf-x.pa, dy=y.pf-y.pa;
        if(dy!==dx) return dy-dx;                       // 2 · point difference
        const sub=h2h([x,y],ms);                        // 3 · head-to-head
        if(sub[y.tid].w!==sub[x.tid].w) return sub[y.tid].w-sub[x.tid].w;
        if(sub[y.tid].diff!==sub[x.tid].diff) return sub[y.tid].diff-sub[x.tid].diff;
        if(y.pf!==x.pf) return y.pf-x.pf;               // 4 · points scored
        return teamById(x.tid).pos-teamById(y.tid).pos; // 5 · drawn order, pending lots
      });
    }
    out=out.concat(g);
  });
  return out;
}

function leagueTable(sportKey){
  const rows={}; TEAMS.forEach(t=>rows[t.id]=blankRow(t.id));
  const ms=state.matches.filter(m=>m.sport===sportKey&&m.stage==='league');
  ms.forEach(m=>{ const r=resultOf(m); if(!r) return;
    const A=rows[m.a], B=rows[m.b];
    A.p++;B.p++;
    if(sportKey==='CR'){ const t=scoreText(m); const g={a:Number(t[0])||0,b:Number(t[1])||0};
      A.pf+=g.a;A.pa+=g.b;B.pf+=g.b;B.pa+=g.a;
      if(r==='a'){A.w++;B.l++;A.pts+=2;} else if(r==='b'){B.w++;A.l++;B.pts+=2;} else {A.d++;B.d++;A.pts++;B.pts++;} }
    /* v5.0 — Chess pays 2 for a win and 1 each for a draw, matching Carrom and
       the racket group tables. It is exactly double the old 1 / ½ / 0, so every
       standing and tie-break is unchanged; only the numbers on the table differ. */
    else { if(r==='a'){A.w++;B.l++;A.pts+=2;} else if(r==='b'){B.w++;A.l++;B.pts+=2;}
           else {A.d++;B.d++;A.pts+=1;B.pts+=1;} }
  });
  return sortTable(Object.values(rows), ms);
}

/* order two teams by their group-stage record (used for 5th–8th and projections) */
function byRecord(sportKey,ids){
  const all={}; ['A','B'].forEach(g=>groupTable(sportKey,g).forEach(r=>all[r.tid]=r));
  return ids.slice().sort((x,y)=>{ const rx=all[x]||blankRow(x), ry=all[y]||blankRow(y);
    if(ry.w!==rx.w) return ry.w-rx.w;
    const dx=rx.pf-rx.pa, dy=ry.pf-ry.pa; if(dy!==dx) return dy-dx;
    if(ry.pf!==rx.pf) return ry.pf-rx.pf;
    return teamById(x).pos-teamById(y).pos; });
}
const findM = (sk,stage) => state.matches.find(m=>m.sport===sk&&m.stage===stage);

/* wire semi-final / final / play-off participants once the groups resolve */
function syncKnockouts(){
  SPORTS.filter(s=>s.kind==='racket').forEach(s=>{
    const A=groupTable(s.k,'A'), B=groupTable(s.k,'B');
    const gDone=state.matches.filter(m=>m.sport===s.k&&m.stage==='group').every(isPlayed);
    const sf1=findM(s.k,'sf1')||state.matches.find(m=>m.id===s.k+'-sf1');
    const sf2=state.matches.find(m=>m.id===s.k+'-sf2');
    const th =state.matches.find(m=>m.id===s.k+'-third');
    const fi =state.matches.find(m=>m.id===s.k+'-final');
    if(gDone && A.length>1 && B.length>1){
      if(!sf1.log.length){ sf1.a=A[0].tid; sf1.b=B[1].tid; }
      if(!sf2.log.length){ sf2.a=B[0].tid; sf2.b=A[1].tid; }
    } else {
      /* the group stage has been reopened — a semi-final that has not started
         must let go of the teams it was holding, or it would keep a pairing the
         table no longer supports */
      [sf1,sf2].forEach(m=>{ if(!m.log.length){ m.a=null; m.b=null; } });
    }
    const w=m=>{const r=racketWinner(m); return r?(r==='a'?m.a:m.b):null;};
    const l=m=>{const r=racketWinner(m); return r?(r==='a'?m.b:m.a):null;};
    if(w(sf1)&&w(sf2)){ if(!fi.log.length){ fi.a=w(sf1); fi.b=w(sf2); }
                        if(!th.log.length){ th.a=l(sf1); th.b=l(sf2); } }
    else [fi,th].forEach(m=>{ if(!m.log.length){ m.a=null; m.b=null; } });
  });
}

/* final 1–8 ranking for one sport; prov=true while it is still a projection */
function sportRanking(sportKey){
  const s=SP[sportKey];
  if(s.kind==='league'){
    const tb=leagueTable(sportKey);
    const done=state.matches.filter(m=>m.sport===sportKey).every(isPlayed);
    return {order:tb.map(r=>r.tid), prov:!done};
  }
  const A=groupTable(sportKey,'A'), B=groupTable(sportKey,'B');
  const fi=state.matches.find(m=>m.id===sportKey+'-final');
  const th=state.matches.find(m=>m.id===sportKey+'-third');
  const sf1=state.matches.find(m=>m.id===sportKey+'-sf1');
  const sf2=state.matches.find(m=>m.id===sportKey+'-sf2');
  const w=m=>{const r=racketWinner(m);return r?(r==='a'?m.a:m.b):null;};
  const l=m=>{const r=racketWinner(m);return r?(r==='a'?m.b:m.a):null;};
  let top2, mid2;
  if(w(fi)) top2=[w(fi),l(fi)];
  else if(w(sf1)&&w(sf2)) top2=byRecord(sportKey,[w(sf1),w(sf2)]);
  else top2=byRecord(sportKey,[A[0]&&A[0].tid,B[0]&&B[0].tid].filter(Boolean));
  if(w(th)) mid2=[w(th),l(th)];
  else if(w(sf1)&&w(sf2)) mid2=byRecord(sportKey,[l(sf1),l(sf2)]);
  else mid2=byRecord(sportKey,[A[1]&&A[1].tid,B[1]&&B[1].tid].filter(Boolean));
  const p56=byRecord(sportKey,[A[2]&&A[2].tid,B[2]&&B[2].tid].filter(Boolean));
  const p78=byRecord(sportKey,[A[3]&&A[3].tid,B[3]&&B[3].tid].filter(Boolean));
  const order=[].concat(top2,mid2,p56,p78);
  TEAMS.forEach(t=>{ if(!order.includes(t.id)) order.push(t.id); });
  return {order:order, prov:!(racketWinner(fi)&&racketWinner(th))};
}

const sportStarted  = sk => state.matches.some(m=>m.sport===sk && isPlayed(m));
/* A sport contributes championship points only when every one of its matches is
   done. Until then its ranking is a projection — teams that have not played a
   single match in that sport must not be sitting on points because of it. */
const sportComplete = sk => state.matches.filter(m=>m.sport===sk).every(isPlayed);
const teamPlayedIn  = (sk,tid) => state.matches.some(m=>m.sport===sk&&isPlayed(m)&&(m.a===tid||m.b===tid));

function championship(){
  const rankBy={}, provBy={}, onBy={};
  SPORT_ORDER.forEach(sk=>{ const r=sportRanking(sk); rankBy[sk]=r.order; provBy[sk]=r.prov;
    onBy[sk]=sportStarted(sk); });
  const rows=TEAMS.map(t=>{
    const cells={}; let total=0;
    SPORT_ORDER.forEach(sk=>{
      const done=sportComplete(sk);
      const i=onBy[sk]?rankBy[sk].indexOf(t.id):-1, rk=i<0?null:i+1;
      const would=rk?SP[sk].pts[rk-1]:0;
      const pts=done?would:0;                    // nothing banked until the sport is finished
      cells[sk]={rank:rk, pts:pts, would:would, prov:provBy[sk], done:done};
      total+=pts;
    });
    const firsts=SPORT_ORDER.filter(sk=>cells[sk].rank===1).length;
    const seconds=SPORT_ORDER.filter(sk=>cells[sk].rank===2).length;
    const pen=penOf(t.id);
    return {tid:t.id, cells:cells, earned:total, pen:pen, total:total-pen,
            firsts:firsts, seconds:seconds};
  });
  rows.sort((x,y)=> y.total-x.total || y.firsts-x.firsts || y.seconds-x.seconds
                    || teamById(x.tid).pos-teamById(y.tid).pos);
  return {rows:rows, prov:SPORT_ORDER.some(sk=>provBy[sk])};
}

/* Turn a typed final score into a rally log so every table, tie-break and
   share sheet downstream keeps working off one representation. */
function setFinal(m,side,val){
  const sc=scoreOf(m); const now={a:sc.a,b:sc.b};
  now[side]=val===''?0:Math.max(0,Math.min(TARGET,parseInt(val,10)||0));
  const log=[]; let x=now.a,y=now.b;
  while(x>0||y>0){ if(x>0){log.push('a');x--;} if(y>0){log.push('b');y--;} }
  m.log=log; m.acked=[GATE1,GATE2];
  m.done=(now.a>=TARGET||now.b>=TARGET);
  syncKnockouts(); save();
}

  h+='<div class="card flat" style="margin:0"><div class="tw"><table><tr><th style="width:22px"></th>'+
    '<th>Team</th><th class="right">'+(done?'Points':'Would earn')+'</th></tr>';
  r.order.forEach((tid,i)=>{ const t=teamById(tid), on=teamPlayedIn(sk,tid);
    h+='<tr'+(on?'':' style="opacity:.5"')+'><td class="cond" style="font-size:15px;color:'+
        (i===0&&done?'var(--gold)':'var(--dim)')+'">'+(i+1)+'</td>'+
      '<td><span class="row">'+swatch(t)+'<span class="tname">'+esc(t.name)+'</span>'+

      '<td class="right mono">'+(done?'<b>'+SP[sk].pts[i]+'</b>':'('+SP[sk].pts[i]+')')+'</td></tr>'; });
  return h+'</table></div></div>';
}

function viewStandings(){

  h+='<div class="chipbar"><button class="chip'+(state.standSport==='overall'?' on':'')+'" data-ss="overall">Championship</button>'+
    SPORT_ORDER.map(k=>'<button class="chip'+(state.standSport===k?' on':'')+'" data-ss="'+k+'" data-sp="'+k+'">'+esc(SP[k].name)+'</button>').join('')+'</div>';

/* ============================ STATS ============================ */
const RACKET_KEYS = SPORT_ORDER.filter(k=>SP[k].kind==='racket');

function viewStats(){
  const sk=state.statSport||'all';
  let h='<h2 class="sec">Stats</h2>';
  h+='<div class="chipbar"><button class="chip'+(sk==='all'?' on':'')+'" data-sps="all">All racket sports</button>'+
    RACKET_KEYS.map(k=>'<button class="chip'+(sk===k?' on':'')+'" data-sps="'+k+'" data-sp="'+k+'">'+
      esc(SP[k].name)+'</button>').join('')+'</div>';

  const R=rallyStats(sk);
  if(!R.players.length) return h+'<div class="empty"><b>No rally data yet</b>'+
    'Stats are built by replaying matches scored point by point with line-ups set. '+
    'Matches recorded with Final score only count towards the tables, not these numbers.</div>';

  const mvp=R.players.slice().sort((x,y)=>y.diff-x.diff||y.rate-x.rate)[0];
  h+='<p class="hint">Every rally is credited to the two players actually on court for it. '+
     R.withLineups+' of '+R.total+' scored '+(sk==='all'?'racket ':esc(SP[sk].name)+' ')+'matches have line-up data'+
     (R.withLineups<R.total?' — final-score-only matches are excluded.':'.')+'</p>';

  h+='<div class="mvp"><div class="eyebrow" style="color:var(--gold)">Most valuable player'+
    (sk==='all'?'':' · '+esc(SP[sk].name))+'</div>'+
    '<div class="mvpn" style="color:'+tcol(mvp.team)+'">'+esc(mvp.p.name)+'</div>'+
    '<div class="mvpt">'+swatch(mvp.team)+' '+esc(mvp.team.name)+'</div>'+
    '<div class="mvpstats">'+
      '<div><b>'+(mvp.diff>0?'+':'')+mvp.diff+'</b><span>rally +/−</span></div>'+
      '<div><b>'+mvp.won+'</b><span>points won</span></div>'+
      '<div><b>'+mvp.rate+'%</b><span>win rate</span></div>'+
      '<div><b>'+mvp.hold+'%</b><span>held serve</span></div></div></div>';

  const views=[['players','Players'],['pairs','Pairs'],['serve','Serving'],['clutch','Clutch']];
  h+='<div class="chipbar">'+views.map(v=>'<button class="chip'+(state.statsView===v[0]?' on':'')+
    '" data-sv="'+v[0]+'">'+v[1]+'</button>').join('')+
    '<button class="chip" data-sharestats="1">Share</button></div>';

  const nameCell=o=>'<td><span class="row">'+swatch(o.team)+'<span><span class="tname">'+
    esc(o.p?o.p.name:(pName(o.ids[0])+' & '+pName(o.ids[1])))+'</span>'+
    '<span class="dim" style="font-size:9.5px;display:block;line-height:1.2">'+esc(o.team.name)+'</span></span></span></td>';
  const dcell=d=>'<td class="right mono" style="font-weight:700;color:'+
    (d>0?'var(--tealInk)':d<0?'var(--redInk)':'var(--dim)')+'">'+(d>0?'+':'')+d+'</td>';
  const rank=i=>'<td class="cond" style="font-size:15px;color:'+(i<3?'var(--gold)':'var(--dim)')+'">'+(i+1)+'</td>';
  const wrap=(head,rows)=>'<div class="card flat" style="margin:0"><div class="tw"><table><tr>'+head+'</tr>'+rows+'</table></div></div>';
  const v=state.statsView||'players';

  if(v==='players'){
    const rows=R.players.slice().sort((x,y)=>y.diff-x.diff||y.rate-x.rate).map((o,i)=>
      '<tr>'+rank(i)+nameCell(o)+'<td class="right mono">'+o.played+'</td>'+
      '<td class="right mono">'+o.rallies+'</td><td class="right mono"><b>'+o.won+'</b></td>'+
      '<td class="right mono">'+o.lost+'</td>'+dcell(o.diff)+'<td class="right mono">'+o.rate+'%</td></tr>').join('');
    h+=wrap('<th style="width:22px"></th><th>Player</th><th class="right">M</th><th class="right">Rly</th>'+
      '<th class="right">W</th><th class="right">L</th><th class="right">+/−</th><th class="right">Win%</th>',rows);
    h+='<p class="hint">M = matches. A rally counts for both players on court when it is won or lost.</p>';
  } else if(v==='pairs'){
    const rows=R.pairs.slice().sort((x,y)=>y.diff-x.diff||y.rate-x.rate).slice(0,20).map((o,i)=>
      '<tr>'+rank(i)+nameCell(o)+'<td class="right mono">'+o.rallies+'</td>'+
      '<td class="right mono"><b>'+o.won+'</b></td><td class="right mono">'+o.lost+'</td>'+
      dcell(o.diff)+'<td class="right mono">'+o.rate+'%</td></tr>').join('');
    h+=wrap('<th style="width:22px"></th><th>Partnership</th><th class="right">Rly</th><th class="right">W</th>'+
      '<th class="right">L</th><th class="right">+/−</th><th class="right">Win%</th>',rows);
    h+='<p class="hint">Every declared pair that took the court, best first.</p>';
  } else if(v==='serve'){
    const rows=R.players.filter(o=>o.serves>0).sort((x,y)=>y.hold-x.hold||y.serves-x.serves).map((o,i)=>
      '<tr>'+rank(i)+nameCell(o)+'<td class="right mono">'+o.serves+'</td>'+
      '<td class="right mono"><b>'+o.servePts+'</b></td>'+
      '<td class="right mono" style="color:var(--gold);font-weight:700">'+o.hold+'%</td></tr>').join('');
    h+=wrap('<th style="width:22px"></th><th>Player</th><th class="right">Serves</th>'+
      '<th class="right">Won</th><th class="right">Hold%</th>',rows);
    h+='<p class="hint">Rallies won on their own serve. Hold% is how often serving turned into a point.</p>';
  } else {
    const rows=R.players.filter(o=>o.cw+o.cl>0).sort((x,y)=>y.cdiff-x.cdiff||y.cw-x.cw).map((o,i)=>
      '<tr>'+rank(i)+nameCell(o)+'<td class="right mono">'+(o.cw+o.cl)+'</td>'+
      '<td class="right mono"><b>'+o.cw+'</b></td><td class="right mono">'+o.cl+'</td>'+dcell(o.cdiff)+'</tr>').join('');
    h+=wrap('<th style="width:22px"></th><th>Player</th><th class="right">Rly</th><th class="right">W</th>'+
      '<th class="right">L</th><th class="right">+/−</th>',rows);
    h+='<p class="hint">Only rallies played once a team reached '+CLUTCH_FROM+' — the closing stretch of a game to '+TARGET+'.</p>';
  }
  return h;
}

const shareText = t => { if(navigator.share){ navigator.share({text:t}).catch(()=>{}); return; }
