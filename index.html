function ledgerText(){
  const ch=championship();
  let t='*Odyssey Sports League 2026*\nChampionship board\n\n';
  ch.rows.forEach((r,i)=>{ t+=(i+1)+'. '+teamById(r.tid).name+' — '+r.total+' pts\n'; });
  if(ch.prov) t+='\n_Projected — some sports are still to finish._';
  return t.trim();
}
function matchText(m){
  const A=teamById(m.a), B=teamById(m.b), s=scoreText(m), r=resultOf(m);
  let t='*'+SP[m.sport].name+' · '+stageName(m)+'*\n'+
    (A?A.name:'TBD')+'  '+s[0]+' – '+s[1]+'  '+(B?B.name:'TBD');
  if(r&&r!=='d') t+='\n\n🏆 '+teamById(r==='a'?m.a:m.b).name+' win';
  else if(r==='d') t+='\n\nDrawn';

}
function statsText(){
  const R=rallyStats(state.statSport||'all');
  if(!R.players.length) return 'No rally stats yet.';
  const P=R.players.slice().sort((x,y)=>y.diff-x.diff);
  const S=R.players.filter(o=>o.serves>2).sort((x,y)=>y.hold-x.hold);
  const PR=R.pairs.slice().sort((x,y)=>y.diff-x.diff);
  let t='*Odyssey Sports League 2026 — Stats*\n';
  t+='\n🏅 *MVP:* '+P[0].p.name+' ('+P[0].team.name+') — '+(P[0].diff>0?'+':'')+P[0].diff+' rally +/-\n';
  t+='\n*Top players (rally +/-)*\n';
  P.slice(0,5).forEach((o,i)=>{ t+=(i+1)+'. '+o.p.name+' — '+(o.diff>0?'+':'')+o.diff+' ('+o.won+' won)\n'; });
  if(PR.length){ t+='\n*Best pairs*\n';
    PR.slice(0,3).forEach((o,i)=>{ t+=(i+1)+'. '+pName(o.ids[0])+' & '+pName(o.ids[1])+' — '+(o.diff>0?'+':'')+o.diff+'\n'; }); }
  if(S.length){ t+='\n*Best serve hold*\n';
    S.slice(0,3).forEach((o,i)=>{ t+=(i+1)+'. '+o.p.name+' — '+o.hold+'%\n'; }); }
  return t.trim();
}

/* ============================ TEAMS ============================ */
/* The squad list answers "what does this player cover?". Turning it on its head
   answers the question a captain actually asks on the day — "who have I got for
   Pickleball, and is that line-up legal?" — so both views are available. */
function sportView(t,sk){
  const s=SP[sk], nom=nomOf(t.id,sk).filter(p=>isIn(t.id,p));
  const men=nom.filter(p=>pOf(p).g==='M'), wom=nom.filter(p=>pOf(p).g==='F');
  const compulsory = s.kind==='racket' ? (men.length>=s.minM&&wom.length>=s.minF) : nom.length>=s.min;
  const rank={MPB:0,MTT:1,MBM:2,GA:3,GB:4,WM:5,WG:6};
  const ordered=nom.slice().sort((x,y)=>rank[pOf(x).cat]-rank[pOf(y).cat]);
  const mq=marqueeOf(t.id,sk);

  let h='<div class="card" style="margin:9px 0"><div class="row" style="margin-bottom:6px">'+
    '<span class="sptag" data-sp="'+sk+'">'+esc(s.short)+'</span>'+
    '<b class="grow" style="font-size:14px">'+esc(s.name)+'</b>'+
    '<b class="cond" style="font-size:19px">'+nom.length+'</b>'+
    '<span class="dim" style="font-size:11px">/ '+s.max+'</span></div>';
  h+='<div class="row" style="gap:12px;font-size:11.5px" class="muted">'+
     '<span>Men <b>'+men.length+'</b>'+(s.kind==='racket'?'<span class="dim"> / '+s.minM+' needed</span>':'')+'</span>'+
     '<span>Women <b>'+wom.length+'</b>'+(s.kind==='racket'?'<span class="dim"> / '+s.minF+' needed</span>':'')+'</span>'+
     '<span class="grow"></span>'+
     (compulsory?'<span class="pill done">Legal</span>':'<span class="pill live">Short</span>')+'</div>';
  if(nom.length<=s.min && nom.length)
    h+='<p class="hint" style="margin:7px 0 0">No cover — one injury forfeits the match (v5.0).</p>';
  h+='</div>';

  if(!nom.length) return h+'<div class="empty"><b>Nobody named yet</b>Tap the sport tags in the squad view, '+
    'or use Auto-fill nominations.</div>';

  h+='<div class="card flat" style="margin:0"><div class="roster">';
  ordered.forEach(pid=>{
    const p=pOf(pid), others=sportsOfPlayer(t.id,pid).filter(k=>k!==sk), pl=playedSports(t.id,pid);
    h+='<div class="rp2">'+
      '<span class="who"><b>'+esc(p.name)+'</b>'+(p.owner?' <span class="owner">Owner</span>':'')+
        (pid===mq?' <span class="owner" style="background:rgba(46,196,160,.16);color:var(--tealInk)">Marquee</span>':'')+
        '<span class="meta2"><span class="cat '+(p.g==='F'?'w':'m')+'">'+esc(CATS[p.cat].label)+'</span>'+
        '<span class="gsym '+(p.g==='F'?'f':'m')+'">'+(p.g==='F'?'Woman':'Man')+'</span>'+
        (others.length?'<span class="dim" style="font-size:10px">also '+others.join(', ')+'</span>'
                      :'<span class="dim" style="font-size:10px">this sport only</span>')+
        (pl.indexOf(sk)>=0?'<span class="gsym m" style="background:rgba(46,196,160,.14);color:var(--tealInk)">played</span>':'')+
        '</span></span>'+
      (canManage()?'<button class="availb out" data-nom="'+t.id+'|'+sk+'|'+pid+'">Drop</button>':'')+
      '</div>';
  });
  h+='</div></div>';

  const spare=squadIn(t).filter(p=>nom.indexOf(p.id)<0);
  if(canManage()&&spare.length){
    h+='<div class="eyebrow" style="margin:16px 2px 5px">Add to '+esc(s.name)+'</div>';
    h+='<div class="card flat" style="margin:0"><div class="roster">';
    spare.forEach(p=>{
      const why=nomBlock(t.id,sk,p.id), mine=sportsOfPlayer(t.id,p.id);
      h+='<div class="rp2'+(why?' out':'')+'">'+
        '<span class="who"><b>'+esc(p.name)+'</b><span class="meta2">'+
        '<span class="cat '+(p.g==='F'?'w':'m')+'">'+esc(CATS[p.cat].short)+'</span>'+
        '<span class="gsym '+(p.g==='F'?'f':'m')+'">'+(p.g==='F'?'W':'M')+'</span>'+
        '<span class="dim" style="font-size:10px">'+(mine.length?mine.join(', '):'no sport yet')+'</span>'+
        '</span></span>'+
        (why?'<span class="availb out">'+esc(why)+'</span>'
            :'<button class="availb" data-nom="'+t.id+'|'+sk+'|'+p.id+'">Add</button>')+
        '</div>';
    });
    h+='</div></div>';
  }
  return h;
}

/* Everyone plays at least once (§3.1). Shown as a running check through the
   day: who has been on, who is still due, and who can no longer get on at all. */
function participationBlock(t){
  const pr=participation(t.id), done=pr.played.length, pen=penOf(t.id);
  const pct=pr.squad?Math.round(done/pr.squad*100):0;
  let h='<h2 class="sec" style="font-size:19px;margin-top:20px">Everyone plays once</h2>';
  h+='<p class="hint">§3.1 — no squad member may go the whole league without playing. '+
     'A player counts once they are named in a line-up, a Carrom pair or a Chess round for a match that has started.</p>';
  h+='<div class="card" style="margin:9px 0"><div class="row" style="margin-bottom:7px">'+
     '<b class="cond" style="font-size:20px">'+done+' of '+pr.squad+'</b>'+
     '<span class="grow muted" style="font-size:11.5px">available players have taken the court</span></div>'+
     '<div class="ldg-bar"><i style="width:'+pct+'%;background:var(--teal)"></i></div></div>';

  if(pr.breach.length) h+='<div class="alert bad"><span>⚠</span><span><b>Rule breach · '+pr.breach.length+
    ' player'+(pr.breach.length>1?'s':'')+' can no longer play</b><br>'+
    pr.breach.map(p=>esc(p.name)+(sportsOfPlayer(t.id,p.id).length?'':' — never nominated')).join('<br>')+
    '<br><span style="font-weight:400">Every sport they were named in is finished. This is a §3.1 breach for the Sports Committee.</span></span></div>';

  if(pr.unnamed.length && !pr.breach.length) h+='<div class="alert warn"><span>⚠</span><span><b>Not nominated anywhere · '+
    pr.unnamed.length+'</b><br>'+pr.unnamed.map(p=>esc(p.name)).join(', ')+
    '<br><span style="font-weight:400">They must be named in at least one sport or the team breaches §3.1.</span></span></div>';

  const dayOn=state.matches.some(m=>isPlayed(m)||isLive(m));
  if(pr.waiting.length && !dayOn)
    h+='<div class="alert warn"><span>◷</span><span>The day has not started — every player is still to come on.</span></div>';
  else if(pr.waiting.length)
    h+='<div class="alert warn"><span>◷</span><span><b>Still to play · '+pr.waiting.length+
      '</b><br>'+pr.waiting.map(p=>esc(p.name)+' <span class="dim">('+
        (sportsOfPlayer(t.id,p.id).join(', ')||'no sport')+')</span>').join('<br>')+'</span></div>';

  if(!pr.breach.length && !pr.waiting.length && !pr.unnamed.length && pr.squad)
    h+='<div class="alert ok"><span>✓</span><span>Every available player has been on. §3.1 satisfied.</span></div>';

  /* penalty */
  const suggest=pr.breach.length*PEN_PER_PLAYER;
  if(suggest) h+='<div class="alert bad"><span>−</span><span><b>Rules set this at '+suggest+' points</b><br>'+
    PEN_PER_PLAYER+' per available player who never took the court (v5.0).</span></div>';
  h+='<div class="eyebrow" style="margin:16px 2px 5px">Penalty</div>';
  if(pen) h+='<div class="alert bad"><span>−</span><span><b>'+pen+' championship points deducted</b>'+
    (penNote(t.id)?'<br>'+esc(penNote(t.id)):'')+'</span></div>';
  else h+='<p class="hint" style="margin:0 2px 7px">No penalty on this team.</p>';
  if(canManage()){
    h+='<div class="card" style="margin:0"><label class="fl">Deduction (championship points)</label>'+
      '<div class="row"><input type="number" id="penpts_'+t.id+'" value="'+(pen||'')+'" placeholder="0" style="width:110px">'+
      '<input type="text" id="pennote_'+t.id+'" value="'+esc(penNote(t.id))+'" placeholder="Reason — e.g. §3.1, two players unused" class="grow"></div>'+
      '<div class="row" style="margin-top:9px;flex-wrap:wrap;gap:7px">'+
      '<button class="btn sm pri" data-pensave="'+t.id+'">Apply</button>'+
      (suggest?'<button class="btn sm" data-pensuggest="'+t.id+'|'+suggest+'">Use suggested '+suggest+'</button>':'')+
      (pen?'<button class="btn sm dan" data-penclear="'+t.id+'">Remove penalty</button>':'')+'</div>'+
      '<p class="hint">Deducted from the team\'s championship total. The rules set no fixed figure, so '+
      PEN_PER_PLAYER+' points per unused player is the figure set in the rules (v5.0); '+
      'the Sports Committee may still apply a different amount here.</p></div>';
  }
  return h;
}

function viewTeam(t){
  const issues=nomIssues(t.id), inSquad=squadIn(t), outSquad=squadOut(t);
  let h='<button class="btn sm" data-back="teams" style="margin:12px 0 0">← All teams</button>';
  h+='<h2 class="sec" style="color:'+tcol(t)+'">'+esc(t.name)+'</h2><p class="hint">'+esc(t.owners)+'</p>';
  h+='<div class="stat"><div><b>'+inSquad.length+'</b><span>Available</span></div>'+
     '<div><b>'+inSquad.filter(p=>p.g==='M').length+'</b><span>Men</span></div>'+
     '<div><b>'+inSquad.filter(p=>p.g==='F').length+'</b><span>Women</span></div></div>';

  /* --- Sports coverage & assignment --- */
  h+='<h2 class="sec" style="font-size:19px;margin-top:18px">Sports coverage</h2>';
  h+='<p class="hint">Each player may cover two sports'+(soleWoman(t.id)?', and the team\'s only woman may play all three racket sports':'')+
     (shortOfMen(t.id)?'. With fewer than '+MIN_MEN+' men available, a Men General B player may take a third — subject to approval':'')+
     '. Tap a sport to name a player or drop them.</p>';

  h+='<div class="covrow">'+SPORT_ORDER.map(sk=>{ const s=SP[sk], n=nomOf(t.id,sk).length;
    const short=s.kind==='racket' ? (nomBy(t.id,sk,'M')<s.minM||nomBy(t.id,sk,'F')<s.minF) : n<s.min;
    return '<div class="covchip'+(short?' short':'')+'" data-sp="'+sk+'">'+
      '<b'+(short?'':' style="color:currentColor"')+'>'+n+'</b><span>'+esc(s.short)+'</span></div>'; }).join('')+'</div>';

  h+='<div class="card" style="margin:9px 0"><div class="eyebrow" style="margin-bottom:6px">Nominated · by gender</div>'+
     '<div class="tw"><table class="gt"><tr><th></th>'+
     SPORT_ORDER.map(sk=>'<th data-sp="'+sk+'">'+esc(SP[sk].short)+'</th>').join('')+'</tr>';
  [['M','Men','minM'],['F','Women','minF']].forEach(g=>{
    h+='<tr><td class="'+(g[0]==='F'?'gsym f':'gsym m')+'" style="background:none;color:inherit">'+g[1]+'</td>'+
      SPORT_ORDER.map(sk=>{ const s=SP[sk], n=nomBy(t.id,sk,g[0]);
        const bad = s.kind==='racket' && n<s[g[2]];
        return '<td class="'+(bad?'bad':(n?'':'zero'))+'"><b>'+n+'</b></td>'; }).join('')+'</tr>';
  });
  h+='<tr class="tot"><td>Total</td>'+SPORT_ORDER.map(sk=>{ const s=SP[sk], n=nomOf(t.id,sk).length;
    return '<td><b>'+n+'</b> <span class="dim" style="font-size:9px">/'+s.max+'</span></td>'; }).join('')+'</tr>';
  h+='<tr><td class="dim">Need</td>'+SPORT_ORDER.map(sk=>{ const s=SP[sk];
    return '<td class="dim" style="font-size:10px">'+(s.kind==='racket'?'5M+1F':s.min)+'</td>'; }).join('')+'</tr>';
  h+='</table></div></div>';

  if(issues.length) h+='<div class="alert bad"><span>⚠</span><span>'+issues.map(esc).join('<br>')+'</span></div>';
  else h+='<div class="alert ok"><span>✓</span><span>Squad is legal for all five sports.</span></div>';

  /* v5.0 — a sport named at the bare minimum has no bench, and one injury
     forfeits the match. Worth saying out loud while there is still time to fix it. */
  if(shortOfMen(t.id)){
    const third=squadIn(t).filter(p=>needsApproval(t.id,p.id));
    h+='<div class="alert warn"><span>⚠</span><span><b>Short of men · '+menAvailable(t.id)+' available, '+
      MIN_MEN+' needed for a full squad ('+MIN_MEN+'M + '+MIN_WOMEN+'W)</b><br>'+
      'A Men General B player may take a <b>third sport</b> to cover the gap, with the Sports Committee\'s '+
      'and the opponent\'s approval. No other man may go past two. If that still leaves a sport short, the '+
      'team may play it with a handicap or forfeit it — set that on the match screen.'+
      (third.length?'<br><b>Playing three: '+third.map(p=>esc(p.name)).join(', ')+
        '</b> — get this signed off before the match.':'')+
      '</span></div>';
  }
  const bare=SPORT_ORDER.filter(sk=>nomOf(t.id,sk).length<=SP[sk].min);
  if(bare.length) h+='<div class="alert warn"><span>⚠</span><span><b>No cover in '+
    bare.map(sk=>esc(SP[sk].name)).join(', ')+'</b><br>'+
    'Named at the compulsory minimum, so if a player cannot continue the match is forfeited (v5.0). '+
    'Add the optional players wherever the two-sport cap allows.</span></div>';

  if(canManage()) h+='<div class="row" style="margin:10px 0"><button class="btn sm grow" data-auto="'+t.id+'">Auto-fill nominations</button>'+
    '<button class="btn sm grow" data-clearnom="'+t.id+'">Clear all</button></div>';



  /* --- squad rows --- */
  const row=p=>{
    const out=isOut(t.id,p.id), mine=sportsOfPlayer(t.id,p.id);
    let x='<div class="rp2'+(out?' out':'')+'">';
    x+='<span class="who"><b>'+esc(p.name)+'</b>'+(p.owner?' <span class="owner">Owner</span>':'')+
       '<span class="meta2"><span class="cat '+(p.g==='F'?'w':'m')+'">'+esc(CATS[p.cat].label)+'</span>'+
       '<span class="gsym '+(p.g==='F'?'f':'m')+'">'+(p.g==='F'?'Woman':'Man')+'</span>'+
       (out?'<span class="gsym f">Unavailable</span>'
           :'<span class="dim" style="font-size:10px">'+(mine.length?mine.length+' of '+capFor(t.id,p.id)+' sports':'no sport yet')+'</span>')+
       '</span></span>';
    x+='<span class="spx">'+SPORT_ORDER.map(sk=>{
      const on=mine.includes(sk), blocked=nomBlock(t.id,sk,p.id);
      return '<span class="spb'+(on?' on':'')+(blocked?' lock':'')+(canManage()&&!out?' tap':'')+'" data-sp="'+sk+'" '+
        (canManage()&&!out?'data-nom="'+t.id+'|'+sk+'|'+p.id+'"':'')+' title="'+esc(blocked||SP[sk].name)+'">'+
        '<span class="lg">'+esc(SP[sk].name)+'</span><span class="sh">'+sk+'</span></span>'; }).join('')+'</span>';
    if(canManage()) x+='<button class="availb'+(out?' out':'')+'" data-avail="'+t.id+'|'+p.id+'|'+(out?'in':'out')+'">'+
      (out?'Mark available':'Unavailable')+'</button>';
    return x+'</div>';
  };

  h+='<div class="chipbar" style="margin-top:16px">'+
     '<button class="chip'+(state.teamView==='squad'?' on':'')+'" data-tv="squad">Squad</button>'+
     SPORT_ORDER.map(sk=>'<button class="chip'+(state.teamView===sk?' on':'')+'" data-tv="'+sk+'" data-sp="'+sk+'">'+
       esc(SP[sk].name)+'</button>').join('')+'</div>';

  if(state.teamView!=='squad'){
    h+=sportView(t,state.teamView);
    if(canManage()){
      h+='<div class="row" style="margin:14px 0 4px;gap:7px;flex-wrap:wrap">'+
         '<button class="btn sm grow" data-doprint="sq:blank:'+t.id+'">Print this sport</button>'+
         '<button class="btn sm grow" data-doprint="sq:blank:all">All eight teams</button></div>';
      h+='<p class="hint">One page per team for '+esc(SP[state.teamView].name)+' — who is named, and the '+
         'boxes to write the line-up in.</p>';
    }
    return h;
  }

  h+='<div class="eyebrow" style="margin:18px 2px 5px">Squad · '+inSquad.length+' available</div>';
  h+='<div class="card flat" style="margin:0"><div class="roster">'+inSquad.map(row).join('')+'</div></div>';
  if(outSquad.length){
    h+='<div class="eyebrow" style="margin:18px 2px 5px">Not available on match day · '+outSquad.length+'</div>';
    h+='<p class="hint" style="margin:0 2px 6px">Left out of every count and quota until they are marked back in.</p>';
    h+='<div class="card flat" style="margin:0"><div class="roster">'+outSquad.map(row).join('')+'</div></div>';
  }

  h+=participationBlock(t);
  if(canManage()){
  h+='<div class="eyebrow" style="margin:18px 2px 5px">Print</div>';
  h+='<div class="row" style="margin:4px 0;gap:7px;flex-wrap:wrap">'+
     '<button class="btn sm grow" data-pdf="'+t.id+'">Team sheet</button>'+
     '<button class="btn sm grow" data-pdf="all">Team sheet · all eight</button></div>';
  h+='<div class="row" style="margin:4px 0 0;gap:7px;flex-wrap:wrap">'+
     '<button class="btn sm pri grow" data-doprint="tf:blank:'+t.id+'">Captain\'s line-up form</button>'+
     '<button class="btn sm grow" data-doprint="tf:blank:all">Form · all eight</button></div>';
  h+='<p class="hint">The captain\'s form is this team only — every sport it plays, with nothing about the '+
     'opponent\'s pairs on it. Captains fill it in and hand it to the desk, which copies it onto the '+
     'official line-up sheet from the fixtures page.</p>';
  }
  return h;
}

/* ============================ TEAM SHEET (PRINT / PDF) ============================
   Rendered into a hidden block and handed to the browser's print dialog, which
   every phone and laptop can save as a PDF. No library, nothing to download. */
function teamSheet(t){
  const pr=participation(t.id), issues=nomIssues(t.id), inSq=squadIn(t), outSq=squadOut(t);
  const d=new Date(), stamp=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+
    ' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const head='<div class="phd"><img src="'+LOGO+'" alt=""><div><h1>'+esc(t.name)+'</h1>'+
     '<div class="sub">Odyssey Sports League 2026 · Team Sheet</div></div>'+
     '<div class="rt">'+esc(t.owners)+'<br>Printed '+esc(stamp)+'</div></div>';
  let h='';

  h+='<h2>Nominations by sport</h2><table><tr><th>Sport</th><th class="c">Req</th><th class="c">M</th>'+
     '<th class="c">W</th><th>Players nominated</th></tr>';
  SPORT_ORDER.forEach(sk=>{
    const sp=SP[sk], list=nomOf(t.id,sk);
    const names=list.map(pid=>esc(pName(pid))+(pOf(pid).g==='F'?' (W)':'')).join(', ')||'—';
    h+='<tr><td><b>'+esc(sp.name)+'</b></td><td class="c">'+(sp.kind==='racket'?'5M+1F':sp.min)+'</td>'+
      '<td class="c">'+nomBy(t.id,sk,'M')+'</td><td class="c">'+nomBy(t.id,sk,'F')+'</td>'+
      '<td>'+names+'</td></tr>';
  });
  h+='</table><p class="note">Racket sports: 6 compulsory (5 men + 1 woman), up to 8. Carrom 2–4, Chess 1–2, both gender-neutral. '+
     'Maximum two sports per player; a team\'s only available woman may play all three racket sports, and '+
     'with fewer than '+MIN_MEN+' men available a Men General B player may take a third with committee and '+
     'opponent approval.</p>'+
     (shortOfMen(t.id)?'<p class="note"><b>Short of men: '+menAvailable(t.id)+' available, '+MIN_MEN+
       ' needed.</b> Any Men General B player listed with three sports below is playing a third under that '+
       'exception and needs sign-off.</p>':'');

  h+='<h2>Squad · '+inSq.length+' available'+(outSq.length?' · '+outSq.length+' unavailable':'')+'</h2>';
  /* One "played" box per sport the player may take, so a sheet printed before
     the first match can be filled in with a pen and still matches what the app
     writes if the day is scored on the console instead. */
  const maxPlay=Math.max.apply(null,squadIn(t).map(p=>capFor(t.id,p.id)).concat([2]));
  h+='<table class="squad"><thead><tr><th class="c w-n">#</th><th>Player</th><th>Category</th>'+
     '<th class="c w-mw">M/W</th>'+
     SPORT_ORDER.map(k=>'<th class="c w-sp">'+k+'</th>').join('')+'<th class="c w-sp">Sports</th>'+
     Array.apply(null,{length:maxPlay}).map((x,i)=>'<th class="c plc">Played '+(i+1)+'</th>').join('')+
     '</tr></thead><tbody>';
  const line=(p,i,out)=>{
    const mine=sportsOfPlayer(t.id,p.id), pl=playedSports(t.id,p.id), cap=capFor(t.id,p.id);
    return '<tr'+(out?' class="out"':'')+'><td class="c w-n">'+i+'</td>'+
      '<td>'+esc(p.name)+(p.owner?' <b>(Owner)</b>':'')+(out?' — unavailable':'')+'</td>'+
      '<td>'+esc(CATS[p.cat].label)+'</td><td class="c w-mw">'+(p.g==='F'?'W':'M')+'</td>'+
      SPORT_ORDER.map(k=>'<td class="c w-sp '+(mine.indexOf(k)>=0?'yes':'no')+'">'+(mine.indexOf(k)>=0?'●':'·')+'</td>').join('')+
      '<td class="c w-sp">'+mine.length+'</td>'+
      Array.apply(null,{length:maxPlay}).map((x,i2)=>
        '<td class="c plc'+(i2>=cap?' na':'')+'">'+(i2<cap?esc(pl[i2]||''):'')+'</td>').join('')+
      '</tr>';
  };
  inSq.forEach((p,i)=>h+=line(p,i+1,false));
  outSq.forEach((p,i)=>h+=line(p,inSq.length+i+1,true));
  h+='</tbody></table>';

  h+='<h2>Compliance</h2>';
  if(issues.length) h+='<div class="warn"><b>Nomination issues</b><br>'+issues.map(esc).join('<br>')+'</div>';
  else h+='<div class="okbox"><b>Nominations legal for all five sports.</b></div>';
  h+='<div class="'+(pr.breach.length?'warn':'okbox')+'"><b>§3.1 everyone plays once — '+
     pr.played.length+' of '+pr.squad+' available players have taken the court.</b>'+
     (pr.waiting.length?'<br>Still to play: '+pr.waiting.map(p=>esc(p.name)).join(', '):'')+
     (pr.breach.length?'<br><b>Breach — can no longer play: '+pr.breach.map(p=>esc(p.name)).join(', ')+'</b>':'')+
     '</div>';
  if(penOf(t.id)) h+='<div class="warn"><b>Penalty: −'+penOf(t.id)+' championship points.</b>'+
     (penNote(t.id)?' '+esc(penNote(t.id)):'')+'</div>';

  h+='<div class="sign"><div>Team Captain — name &amp; signature</div>'+
     '<div>Sports Committee — name &amp; signature</div></div>';
  return sheet(head,h);
}

/* ---------- board as an image ----------
   A picture pastes into WhatsApp intact; text loses its columns the moment
   anyone's font changes. Drawn straight onto a canvas so the file stays
   self-contained — no library, works with no signal. */
function boardCanvas(){
  const ch=championship(), S=2;                       // draw at 2× for a crisp result
  const W=760, rowH=44, headH=112, footH=44;
  const H=headH+rowH*(ch.rows.length+1)+footH;
  const c=document.createElement('canvas');
  c.width=W*S; c.height=H*S;
  const x=c.getContext('2d'); x.scale(S,S);
  const F=(w,sz,fam)=>w+' '+sz+'px '+(fam||'"IBM Plex Sans",system-ui,sans-serif');
  const COND='"Barlow Condensed",system-ui,sans-serif';

  x.fillStyle='#0b1220'; x.fillRect(0,0,W,H);
  x.fillStyle='#16223a'; x.fillRect(0,0,W,headH-18);
  x.fillStyle='#f4b53f'; x.font=F('800',30,COND);
  x.fillText('ODYSSEY SPORTS LEAGUE 2026',22,44);
  x.fillStyle='#93a4c6'; x.font=F('600',13);
  const doneN=SPORT_ORDER.filter(sportComplete).length;
  x.fillText('Championship board · '+doneN+' of 5 sports complete · '+
    new Date().toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),22,68);

  const colX=[22,64,300,360,420,480,540,600], totX=712;
  x.fillStyle='#63739a'; x.font=F('800',11);
  x.fillText('TEAM',colX[1],headH-6);
  SPORT_ORDER.forEach((k,i)=>{ x.textAlign='center'; x.fillText(k,colX[2+i]+22,headH-6); });
  x.textAlign='right'; x.fillText('TOTAL',totX,headH-6); x.textAlign='left';

  ch.rows.forEach((r,i)=>{
    const y=headH+rowH*i, t=teamById(r.tid);
    if(i%2) { x.fillStyle='rgba(255,255,255,.03)'; x.fillRect(0,y,W,rowH); }
    x.strokeStyle='#27395e'; x.lineWidth=1;
    x.beginPath(); x.moveTo(0,y+rowH); x.lineTo(W,y+rowH); x.stroke();
    x.fillStyle=(i===0?'#f4b53f':'#63739a'); x.font=F('800',22,COND);
    x.fillText(String(i+1),colX[0],y+30);
    x.fillStyle=t.hex; x.beginPath(); x.arc(colX[1]-8,y+25,5,0,7); x.fill();
    x.fillStyle='#eaf0fb'; x.font=F('600',15);
    let nm=t.name; while(x.measureText(nm).width>210 && nm.length>4) nm=nm.slice(0,-2);
    x.fillText(nm,colX[1]+4,y+30);
    SPORT_ORDER.forEach((k,j)=>{
      const cell=r.cells[k]; x.textAlign='center';
      x.fillStyle=cell.done?'#eaf0fb':'#63739a'; x.font=F('800',19,COND);
      x.fillText(cell.rank?String(cell.rank):'–',colX[2+j]+22,y+26);
      x.fillStyle='#63739a'; x.font=F('600',9);
      x.fillText(cell.done?String(cell.pts):(cell.rank?'('+cell.would+')':'–'),colX[2+j]+22,y+38);
      x.textAlign='left';
    });
    x.textAlign='right'; x.fillStyle='#eaf0fb'; x.font=F('800',26,COND);
    x.fillText(String(r.total),totX,y+30);
    if(r.pen){ x.fillStyle='#ff7d8d'; x.font=F('800',10); x.fillText('−'+r.pen,totX,y+41); }
    x.textAlign='left';
  });
  x.fillStyle='#63739a'; x.font=F('600',11);
  x.fillText('A sport pays out only when all of its matches are done. '+
    'Bracketed figures are what that rank would earn.',22,H-26);
  return c;
}

function shareBoardImage(){
  let c; try{ c=boardCanvas(); }catch(e){ return toast('Could not draw the board'); }
  c.toBlob(async blob=>{
    if(!blob) return toast('Could not create the image');
    const file=new File([blob],'osl-championship.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Odyssey Sports League 2026'}); return; }catch(e){}
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='osl-championship.png'; a.click();
    toast('Image saved');
  },'image/png');
}

/* ---------- fixture sheets ---------- */
function sheetHead(title,sub){
  const d=new Date(), stamp=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+
    ' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return '<div class="phd"><img src="'+LOGO+'" alt=""><div><h1>'+esc(title)+'</h1>'+
    '<div class="sub">Odyssey Sports League 2026 · '+esc(sub)+'</div></div>'+
    '<div class="rt">Printed '+esc(stamp)+'</div></div>';
}

/* A sheet that runs to a second page must say which sport it belongs to at the
   top of that page too. A table header group is the one thing browsers reliably
   repeat across a page break, so the whole sheet is wrapped in a single-column
   table with the masthead sitting in its <thead>. */
function sheet(headHTML,bodyHTML){
  return '<div class="sheet"><table class="pgt"><thead><tr><td class="pghd">'+headHTML+
    '</td></tr></thead><tbody><tr><td class="pgbd">'+bodyHTML+'</td></tr></tbody></table></div>';
}

/* What fills a knockout slot before the groups resolve, so a blank sheet still
   tells the referee who is due on court. */
const KO_SEED={sf1:['A1','B2'], sf2:['B1','A2'],
               third:['SF1 loser','SF2 loser'], final:['SF1 winner','SF2 winner']};
const KO_TIE ={sf1:'A1 v B2', sf2:'B1 v A2',
               third:'SF1 loser v SF2 loser', final:'SF1 winner v SF2 winner'};
/* A knockout tie is labelled once, in the column heading — "Team · A1" — so the
   cell underneath stays completely clear for the referee to write the team in. */
function seedTag(ms,side){
  if(ms.length!==1) return '';
  const m=ms[0], seed=KO_SEED[m.id.split('-').pop()];
  if(!seed) return '';
  if(side===0?m.a:m.b) return '';            // already decided — no need for the tag
  return ' <span class="seed">'+esc(seed[side])+'</span>';
}
function slotLabels(m){
  const A=teamById(m.a), B=teamById(m.b);
  return [A?esc(A.name):'', B?esc(B.name):''];
}

/* Score margin grid — the reference sheet the committee already works from.
   Each cell is that row team's margin against the column team, so a 25–20 win
   reads +5 for the winner and −5 for the loser. Count the pluses for wins;
   add the column up for points difference, which is what breaks a tie. */
function marginGrid(sk,grp,withData){
  const ids=(grp?groupTable(sk,grp):leagueTable(sk)).map(r=>r.tid);
  const ms=state.matches.filter(m=>m.sport===sk&&(grp?(m.stage==='group'&&m.grp===grp):m.stage==='league'));
  const mar={};
  if(withData) ms.forEach(m=>{ if(!isPlayed(m)) return;
    const tx=scoreText(m), sc={a:Number(tx[0])||0, b:Number(tx[1])||0};
    mar[m.a+'|'+m.b]=sc.a-sc.b; mar[m.b+'|'+m.a]=sc.b-sc.a; });
  const rank={}, tbl=grp?groupTable(sk,grp):leagueTable(sk);
  tbl.forEach((r,i)=>rank[r.tid]=i+1);

  let h='<div class="rnd"><h2>Score margin'+(grp?' · Group '+grp:'')+'</h2>'+
    '<table class="mgrid"><thead><tr><th class="rowhd">'+(grp?'Group '+grp:esc(SP[sk].name))+'</th>'+
    ids.map(t=>'<th class="v">'+esc(teamById(t).name)+'</th>').join('')+
    '<th class="c">Wins</th><th class="c">Diff</th><th class="c">Rank</th><th class="c">H2H</th></tr></thead><tbody>';
  ids.forEach(r=>{
    let wins=0, diff=0, any=false;
    const cells=ids.map(c=>{
      if(r===c) return '<td class="dg"></td>';
      const v=withData?mar[r+'|'+c]:undefined;
      if(v!==undefined){ any=true; if(v>0) wins++; diff+=v; }
      return '<td class="c bx">'+(v===undefined?'':(v>0?'+':'')+v)+'</td>';
    }).join('');
    h+='<tr><td class="nm">'+esc(teamById(r).name)+'</td>'+cells+
      '<td class="c bx">'+(any?wins:'')+'</td>'+
      '<td class="c bx">'+(any?(diff>0?'+':'')+diff:'')+'</td>'+
      '<td class="c bx">'+(withData&&any?rank[r]:'')+'</td><td class="c bx"></td></tr>';
  });
  return h+'</tbody></table><p class="note">Row team\'s margin against the column team. '+
    'A 25–20 win is <b>+5</b> for the winner and <b>−5</b> for the loser. Count the pluses for wins; '+
    'the row total is the points difference, which separates teams level on wins — head-to-head only '+
    'comes into it if the difference is level too.</p></div>';
}

function fixtureSheet(sk,withData){
  const s=SP[sk], list=state.matches.filter(m=>m.sport===sk);
  const head=sheetHead(s.name,(withData?'Results':'Score sheet — to be filled in')+
    ' · '+t12(s.start)+' · '+s.courts+' '+s.unit.toLowerCase());
  let h='';

  /* Group and league rounds go four to a table; every knockout tie gets its own,
     so the two semi-finals read as two separate matches rather than one block. */
  const blocks=[];
  const rounds=[...new Set(list.filter(m=>m.stage==='group'||m.stage==='league')
                               .map(m=>m.stage+'|'+m.round))];
  rounds.forEach(key=>{
    const grp=list.filter(m=>m.stage+'|'+m.round===key);
    blocks.push({label:(grp[0].stage==='group'?'Group round ':'Round ')+grp[0].round,
                 time:grp[0].time, ms:grp});
  });
  list.filter(m=>['sf','third','final'].indexOf(m.stage)>=0).forEach(m=>{
    const id=m.id.split('-').pop();
    const nm={sf1:'Semi-Final 1', sf2:'Semi-Final 2',
              third:'3rd Place Play-off', final:'Final'}[id]||'Knockout';
    blocks.push({label:nm+(KO_TIE[id]?' · '+KO_TIE[id]:''), time:m.time, ms:[m]});
  });

  blocks.forEach(bk=>{
    h+='<div class="rnd"><h2>'+esc(bk.label)+' · '+t12(bk.time)+'</h2>';
    h+='<table class="fxt"><thead><tr><th class="c u">'+
       esc({Courts:'Court',Tables:'Table',Boards:'Board'}[s.unit]||'No')+'</th>'+
       '<th class="tm">Team'+seedTag(bk.ms,0)+'</th><th class="c sc">Score</th><th class="gap"></th>'+
       '<th class="c sc">Score</th><th class="tm">Team'+seedTag(bk.ms,1)+'</th>'+
       (withData?'':'<th class="c rf">Referee</th>')+'</tr></thead><tbody>';
    bk.ms.forEach(m=>{
      const r=withData?resultOf(m):null, sc=withData?scoreText(m):['',''];
      const nm=slotLabels(m);
      h+='<tr><td class="c u">'+m.court+'</td>'+
        '<td class="tm'+(r==='a'?' wn':'')+'">'+nm[0]+'</td>'+
        '<td class="c sc bx">'+esc(sc[0])+'</td><td class="gap"></td>'+
        '<td class="c sc bx">'+esc(sc[1])+'</td>'+
        '<td class="tm'+(r==='b'?' wn':'')+'">'+nm[1]+'</td>'+
        (withData?'':'<td class="c rf bx"></td>')+'</tr>';
    });
    h+='</tbody></table>';
    h+='<p class="note tiny">Left score box belongs to the team on the left, right box to the team on the right. '+
       'The higher score wins — no separate winner column.</p></div>';
  });

  if(s.kind==='racket'){ h+=marginGrid(sk,'A',withData)+marginGrid(sk,'B',withData); }
  else h+=marginGrid(sk,null,withData);
  if(s.kind==='racket') h+='<p class="note">One continuous game to '+TARGET+'. Pair A to 7, Pair B to 14, '+
    'Pair C to the finish. Golden point at 24–24. Ends change at 14.</p>';
  if(sk==='CR') h+='<p class="note">Two boards inside a 20-minute match limit; the higher combined score wins. '+
    'Each carromman, black or white, is worth 1 point; the queen is worth 5. If time runs out, the points standing on the board at that moment count.</p>';
  if(sk==='CH') h+='<p class="note">Rapid, 15 minutes each. Win 2, draw 1 each, loss 0.</p>';
  return sheet(head,h);
}

/* ---------- line-up sheets ---------- */
function lineupSheet(m,withData){
  const s=SP[m.sport], A=teamById(m.a), B=teamById(m.b);
  const head=sheetHead(s.name+' · '+stageName(m),
    s.unit.slice(0,-1)+' '+m.court+' · '+t12(m.time)+' · '+(withData?'Line-ups':'Line-up sheet — to be filled in'));
  let h='';

  const side=t=>{
    const l=withData&&t?((m.lineup||{})[t.id]||[]):[];
    const mq=t?marqueeOf(t.id,m.sport):null;
    let x='<h2>'+(t?esc(t.name):'Team')+(t?' <span style="font-weight:400;font-size:8pt">'+esc(t.owners)+'</span>':'')+'</h2>';
    x+='<table><thead><tr><th style="width:58px">Pair</th><th>Right court</th><th>Left court</th>'+
      '<th class="c" style="width:36px">M/W</th></tr></thead><tbody>';
    [0,1,2].forEach(pi=>{
      const rIdx=withData?rightOf(m,t.id,pi):0;
      const rp=l.length?l[pi*2+rIdx]:null, lp=l.length?l[pi*2+(1-rIdx)]:null;
      const wcount=[rp,lp].filter(p=>p&&pOf(p)&&pOf(p).g==='F').length;
      x+='<tr><td><b>Pair '+'ABC'[pi]+'</b><br><span style="font-size:7pt;color:#666">'+
        (pi===0?'0 to 7':pi===1?'7 to 14':'14 to '+TARGET)+'</span></td>'+
        '<td class="bx">'+(rp?esc(pName(rp)):'')+'</td>'+
        '<td class="bx">'+(lp?esc(pName(lp)):'')+'</td>'+
        '<td class="c bx">'+(l.length?(wcount?'W':'M'):'')+'</td></tr>';
    });
    x+='</tbody></table>';
    if(s.kind==='racket') x+='<p class="note">M/W — mark the pair holding a woman. At least one woman must be in the six, '+
      'and no pair may be two women.'+
      (mq?' '+esc(pName(mq))+' is the '+esc(s.name)+' marquee and closes in Pair C.':'')+'</p>';
    if(!withData && t){
      const nom=nomOf(t.id,m.sport).filter(p=>isIn(t.id,p));
      x+='<p class="note"><b>Nominated:</b> '+(nom.length?nom.map(p=>esc(pName(p))+(pOf(p).g==='F'?' (W)':'')).join(' · ')
        :'nobody nominated yet')+'</p>';
    }
    return x;
  };
  h+=side(A)+side(B);
  h+='<h2>Result</h2><table><tr><th>'+(A?esc(A.name):'Team A')+'</th><th class="c">Score</th>'+
     '<th>'+(B?esc(B.name):'Team B')+'</th><th class="c">Score</th><th class="c">Golden point?</th></tr>'+
     '<tr><td class="bx">&nbsp;</td><td class="c bx">'+(withData?esc(scoreText(m)[0]):'')+'</td>'+
     '<td class="bx">&nbsp;</td><td class="c bx">'+(withData?esc(scoreText(m)[1]):'')+'</td>'+
     '<td class="c bx"></td></tr></table>';
  h+='<div class="sign"><div>'+(A?esc(A.name):'Team A')+' captain</div>'+
     '<div>'+(B?esc(B.name):'Team B')+' captain</div><div>Referee</div></div>';

/* Carrom and Chess run four boards at a time, so the referee wants the whole
   round on one page rather than a sheet per match. */
function roundSheet(sk,round,withData){
  const s=SP[sk], ms=state.matches.filter(m=>m.sport===sk&&m.round===round);
  if(!ms.length) return '';
  const head=sheetHead(s.name+' · Round '+round,
    t12(ms[0].time)+' · '+(withData?'as recorded':'to be filled in')+' · referee copy');
  let h='';

  ms.forEach(m=>{
    const A=teamById(m.a), B=teamById(m.b);
    h+='<div class="rnd"><h2>Board '+m.court+' · '+esc(A.name)+' v '+esc(B.name)+'</h2>';
    if(sk==='CR'){
      h+='<table><thead><tr><th style="width:52px">Board</th><th>'+esc(A.name)+' — pair</th>'+
         '<th class="c" style="width:64px">Points</th><th>'+esc(B.name)+' — pair</th>'+
         '<th class="c" style="width:64px">Points</th></tr></thead><tbody>';
      [0,1].forEach(bi=>{
        const pr=t=>{ const p=((m.pairs||{})[t]||{})['b'+(bi+1)]||[];
          return withData&&p.length?esc([p[0],p[1]].filter(Boolean).map(pName).join(' & ')):''; };
        const bd=(m.boards||[{},{}])[bi]||{};
        h+='<tr><td class="c"><b>'+(bi+1)+'</b></td>'+
          '<td class="bx">'+pr(m.a)+'</td><td class="c bx">'+(withData&&bd.a!=null?bd.a:'')+'</td>'+
          '<td class="bx">'+pr(m.b)+'</td><td class="c bx">'+(withData&&bd.b!=null?bd.b:'')+'</td></tr>';

         '<td></td><td class="c bx">'+(withData&&carromPlayed(m)?g.b:'')+'</td></tr>';
      h+='</tbody></table><p class="note tiny">Two boards inside 20 minutes. Higher combined total wins; equal is a draw. '+

         esc(nomOf(m.b,'CR').filter(p=>isIn(m.b,p)).map(pName).join(', ')||'—')+'</p>';

      const who=t=>{ const pid=((m.players||{})[t]); return withData&&pid?esc(pName(pid)):''; };
      h+='<table><thead><tr><th>'+esc(A.name)+' — player</th><th class="c" style="width:70px">Result</th>'+
         '<th>'+esc(B.name)+' — player</th><th class="c" style="width:70px">Result</th>'+
         '</tr></thead><tbody>'+
         '<tr><td class="bx">'+who(m.a)+'</td>'+
         '<td class="c bx">'+(withData&&m.result?(m.result==='a'?'2':(m.result==='d'?'1':'0')):'')+'</td>'+
         '<td class="bx">'+who(m.b)+'</td>'+
         '<td class="c bx">'+(withData&&m.result?(m.result==='b'?'2':(m.result==='d'?'1':'0')):'')+'</td>'+
         '</tr></tbody></table>'+

         'Nominated: '+esc(nomOf(m.a,'CH').filter(p=>isIn(m.a,p)).map(pName).join(', ')||'—')+' · '+
         esc(nomOf(m.b,'CH').filter(p=>isIn(m.b,p)).map(pName).join(', ')||'—')+'</p>';
    }
    h+='</div>';
  });
  h+='<div class="sign"><div>Referee — name &amp; signature</div><div>Sports Committee</div></div>';

/* ---------- captain's line-up form ----------
   The fixture line-up sheet is the officials' copy and shows both teams side by
   side. This is the captain's copy: one team only, every sport it plays, with
   nothing about the opponent's pairs on it. Captains fill it in, hand it to the
   desk, and the desk copies it onto the official sheet. */
function teamFormSheet(t,withData){
  const head=sheetHead(t.name+' — Line-up form',

  /* Each sport's squad sits with that sport, not in one block at the top — the
     captain is filling one sport at a time and should not have to page back. */

    const nom=nomOf(t.id,sk).filter(p=>isIn(t.id,p));
    const men=nom.filter(p=>pOf(p).g==='M').length, wom=nom.length-men;
    return '<p class="note"><b>Your '+esc(SP[sk].name)+' squad ('+nom.length+'):</b> '+
      (nom.length?nom.map(p=>esc(pName(p))+(pOf(p).g==='F'?' (W)':'')).join(' · ')
                 :'<i>nobody nominated yet</i>')+
      ' <span style="color:#666">— '+men+(men===1?' man':' men')+', '+wom+(wom===1?' woman':' women')+'; '+
      (SP[sk].kind==='racket'?'5 men + 1 woman must take the court':SP[sk].min+' compulsory')+'.</span></p>';
  };

  h+='<div class="rnd"><h2>Squad available · '+squadIn(t).length+'</h2><p class="note">'+

     (shortOfMen(t.id)?'<p class="note"><b>Short of men ('+menAvailable(t.id)+' of '+MIN_MEN+').</b> '+
       'A Men General B player may take a third sport, subject to the Sports Committee\'s and the '+
       'opponent\'s approval. Mark any such player clearly below.</p>':'')+
     '</div>';

  ['PB','TT','BM'].forEach(sk=>{
    const ms=state.matches.filter(m=>SP[m.sport]?m.sport===sk&&(m.a===t.id||m.b===t.id):false);
    const mq=marqueeOf(t.id,sk);
    h+='<div class="rnd"><h2>'+esc(SP[sk].name)+'</h2>';
    h+=nomLine(sk);
    h+='<p class="note tiny">Three pairs, in the order they take the court: Pair A to 7, Pair B to 14, '+
       'Pair C to the finish. At least one woman in the six; no pair may be two women'+
       (mq?'; '+esc(pName(mq))+' is your '+esc(SP[sk].name)+' marquee and closes in Pair C':'')+'.</p>';
    ms.forEach(m=>{
      const opp=teamById(m.a===t.id?m.b:m.a);
      const l=withData?((m.lineup||{})[t.id]||[]):[];
      h+='<table class="lu"><thead><tr>'+
        '<th colspan="4">'+esc(stageName(m))+' · '+t12(m.time)+' · '+
          esc(SP[sk].unit.slice(0,-1))+' '+m.court+' · v '+(opp?esc(opp.name):'TBD')+'</th></tr>'+
        '<tr><th style="width:56px">Pair</th><th>Right court</th><th>Left court</th>'+
        '<th class="c" style="width:36px">M/W</th></tr></thead><tbody>';
      [0,1,2].forEach(pi=>{
        const rIdx=withData?rightOf(m,t.id,pi):0;
        const rp=l.length?l[pi*2+rIdx]:null, lp=l.length?l[pi*2+(1-rIdx)]:null;
        const w=[rp,lp].filter(x=>x&&pOf(x)&&pOf(x).g==='F').length;
        h+='<tr><td><b>Pair '+'ABC'[pi]+'</b></td>'+
          '<td class="bx">'+(rp?esc(pName(rp)):'')+'</td>'+
          '<td class="bx">'+(lp?esc(pName(lp)):'')+'</td>'+
          '<td class="c bx">'+(l.length?(w?'W':'M'):'')+'</td></tr>';
      });
      h+='</tbody></table>';
    });
    h+='</div>';
  });

  const crM=state.matches.filter(m=>m.sport==='CR'&&(m.a===t.id||m.b===t.id));
  h+='<div class="rnd"><h2>Carrom</h2>'+nomLine('CR')+'<p class="note tiny">Two boards per match inside 20 minutes. '+

     '<th>Board 1 — pair</th><th>Board 2 — pair</th></tr></thead><tbody>';
  crM.forEach(m=>{ const opp=teamById(m.a===t.id?m.b:m.a);
    const pr=k=>{ const p=((m.pairs||{})[t.id]||{})[k]||[];
      return withData&&p.length?esc([p[0],p[1]].filter(Boolean).map(pName).join(' & ')):''; };
    h+='<tr><td class="c">'+m.round+'</td><td>'+(opp?esc(opp.name):'')+'</td>'+

  h+='<div class="sign"><div>Captain — name &amp; signature</div>'+
     '<div>Handed in at (time)</div><div>Received by (desk official)</div></div>';
  return sheet(head,h);

/* One sport, one team: who is named, and boxes for the line-up of each match
   that team plays in it. The captain's form covers all five sports at once;
   this is the single-sport version for handing out at the court. */
function sportSheet(t,sk,withData){
  const s=SP[sk], nom=nomOf(t.id,sk).filter(p=>isIn(t.id,p));
  const men=nom.filter(p=>pOf(p).g==='M'), wom=nom.filter(p=>pOf(p).g==='F');
  const mq=marqueeOf(t.id,sk);
  const head=sheetHead(t.name+' — '+s.name,
    (withData?'As recorded':'Nominations and line-ups')+' · '+t12(s.start)+' · '+esc(t.owners));
  let h='';

  h+='<div class="rnd"><h2>Nominated · '+nom.length+' of '+s.max+'</h2>';
  h+='<table class="fxt"><thead><tr><th class="c" style="width:34px">#</th><th>Player</th>'+
     '<th style="width:150px">Category</th><th class="c" style="width:34px">M/W</th>'+
     '<th class="c" style="width:70px">Other</th>'+
     '<th class="c" style="width:52px">Played</th></tr></thead><tbody>';
  const rank={MPB:0,MTT:1,MBM:2,GA:3,GB:4,WM:5,WG:6};
  nom.slice().sort((x,y)=>rank[pOf(x).cat]-rank[pOf(y).cat]).forEach((pid,i)=>{
    const p=pOf(pid), others=sportsOfPlayer(t.id,pid).filter(k=>k!==sk);

      '<td>'+esc(p.name)+(p.owner?' <b>(Owner)</b>':'')+(pid===mq?' <b>· marquee</b>':'')+'</td>'+

      '<td class="c">'+(others.join(' ')||'—')+'</td>'+
      '<td class="c bx">'+(withData&&playedSports(t.id,pid).indexOf(sk)>=0?'&#10003;':'')+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<p class="note">'+men.length+' men · '+wom.length+' women'+
     (s.kind==='racket'?' — 5 men and 1 woman must take the court, up to 6 men and 2 women may be named'
                       :' — '+s.min+' compulsory, up to '+s.max+', gender-neutral')+'. '+
     (nom.length<=s.min?'<b>Named at the minimum: no cover, and one injury forfeits the match (v5.0).</b>':'')+'</p></div>';

  const ms=state.matches.filter(m=>m.sport===sk&&(m.a===t.id||m.b===t.id));
  if(s.kind==='racket'){
    h+='<div class="rnd"><h2>Line-ups</h2><p class="note tiny">Pair A to 7, Pair B to 14, Pair C to the '+
       'finish. At least one woman in the six; no pair may be two women'+
       (mq?'; '+esc(pName(mq))+' closes in Pair C':'')+'.</p></div>';
    ms.forEach(m=>{
      const opp=teamById(m.a===t.id?m.b:m.a), l=withData?((m.lineup||{})[t.id]||[]):[];
      h+='<table class="lu"><thead><tr><th colspan="4">'+esc(stageName(m))+' · '+t12(m.time)+' · '+
        esc(s.unit.slice(0,-1))+' '+m.court+' · v '+(opp?esc(opp.name):'TBD')+'</th></tr>'+
        '<tr><th style="width:56px">Pair</th><th>Right court</th><th>Left court</th>'+
        '<th class="c" style="width:36px">M/W</th></tr></thead><tbody>';
      [0,1,2].forEach(pi=>{
        const rIdx=withData?rightOf(m,t.id,pi):0;
        const rp=l.length?l[pi*2+rIdx]:null, lp=l.length?l[pi*2+(1-rIdx)]:null;
        const w=[rp,lp].filter(x=>x&&pOf(x)&&pOf(x).g==='F').length;
        h+='<tr><td><b>Pair '+'ABC'[pi]+'</b></td><td class="bx">'+(rp?esc(pName(rp)):'')+'</td>'+
          '<td class="bx">'+(lp?esc(pName(lp)):'')+'</td>'+
          '<td class="c bx">'+(l.length?(w?'W':'M'):'')+'</td></tr>';
      });
      h+='</tbody></table>';
    });
  } else {
    h+='<div class="rnd"><h2>'+(sk==='CR'?'Boards':'Rounds')+'</h2>'+
       '<table class="fxt"><thead><tr><th class="c" style="width:52px">Round</th>'+
       '<th style="width:110px">Opponent</th>'+
       (sk==='CR'?'<th>Board 1 — pair</th><th>Board 2 — pair</th>':'<th>Player</th>')+

        h+='<td class="bx">'+pr('b1')+'</td><td class="bx">'+pr('b2')+'</td>'; }
      else { const pid=((m.players||{})[t.id]);
        h+='<td class="bx">'+(withData&&pid?esc(pName(pid)):'')+'</td>'; }
      h+='</tr>'; });
    h+='</tbody></table></div>';
  }

  h+='<div class="sign"><div>Captain — name &amp; signature</div><div>Sports Committee</div></div>';
  return sheet(head,h);
}

function printSheets(){
  const pr=state.print; if(!pr) return '';
  if(pr==='all') return TEAMS.map(teamSheet).join('');
  if(typeof pr==='string' && pr.indexOf(':')<0) return (teamById(pr)?teamSheet(teamById(pr)):'');
  const [kind,mode,scope]=pr.split(':');
  const withData=(mode==='filled');
  if(kind==='sq'){
    const sk=state.teamView; if(!SP[sk]) return '';
    const list=(scope==='all')?TEAMS:[teamById(scope)].filter(Boolean);
    return list.map(t=>sportSheet(t,sk,withData)).join('');
  }
  if(kind==='tf'){
    const list=(scope==='all')?TEAMS:[teamById(scope)].filter(Boolean);
    return list.map(t=>teamFormSheet(t,withData)).join('');
  }
  const sports=(scope==='all')?DAY_ORDER:[scope];
  if(kind==='fx') return sports.map(sk=>fixtureSheet(sk,withData)).join('');
  if(kind==='lu'){
    let out='';
    sports.forEach(sp=>{
      if(SP[sp].kind==='racket'){
        let ms=state.matches.filter(m=>m.sport===sp);
        if(state.teamFilter!=='all') ms=ms.filter(m=>m.a===state.teamFilter||m.b===state.teamFilter);
        if(withData) ms=ms.filter(m=>((m.lineup||{})[m.a]||[]).length||((m.lineup||{})[m.b]||[]).length);
        out+=ms.map(m=>lineupSheet(m,withData)).join('');
      } else {                                   // one page per round, all four boards
        const rounds=[...new Set(state.matches.filter(m=>m.sport===sp).map(m=>m.round))];
        out+=rounds.map(r=>roundSheet(sp,r,withData)).join('');
      }
    });
    if(!out) return sheet(sheetHead('Line-ups','Nothing to print'),
      '<p class="note">No line-ups have been set for this selection yet.</p>');
    return out;
  }
  return '';
}

/* Blank or filled, and for one sport or the whole day. */
function printChooser(kind){
  const scope=(state.sportFilter==='all')?'all':state.sportFilter;
  const what=kind==='fx'?'Fixture sheets':'Line-up sheets';
  const where=scope==='all'?'all five sports':SP[scope].name;
  let h='<h3>'+esc(what)+'</h3><p class="hint" style="margin-bottom:12px">'+
    (kind==='fx'?'One sheet per sport, every match listed with boxes for the scores.'
               :'One sheet per match, three pairs per team with the right and left court named.')+
    '<br>Printing <b>'+esc(where)+'</b>'+
    (kind==='lu'&&state.teamFilter!=='all'?' · <b>'+esc(teamById(state.teamFilter).name)+'</b> only':'')+
    ' — change the filters on the fixtures page to narrow it.</p>';
  if(kind==='lu') h+='<p class="hint" style="margin-bottom:12px">Racket sports print one page per match. '+
    'Carrom and Chess print one page per round — all four boards together, which is what the referee on the floor wants.</p>';
  h+='<div class="row" style="gap:8px;flex-wrap:wrap">'+
     '<button class="btn pri grow" data-doprint="'+kind+':blank:'+scope+'">Blank — to fill in by hand</button>'+
     '<button class="btn grow" data-doprint="'+kind+':filled:'+scope+'">Filled — as recorded</button></div>'+
     '<button class="btn" style="width:100%;margin-top:10px" data-close="1">Cancel</button>';
  return h;
}
/* Paint the sheets, let the browser lay them out, then open the print dialog —
   "Save as PDF" on desktop, Share → Print on a phone. */
function doPrint(which){
  state.print=which; render();
  setTimeout(()=>{ window.print();
    setTimeout(()=>{ state.print=null; render(); },400); },160);
}

function matchHead(m){
  return '<button class="btn sm" data-back="fixtures" style="margin:12px 0 0">← Back</button>'+
    '<div class="row" style="margin:14px 0 2px"><span class="sptag" data-sp="'+m.sport+'">'+esc(SP[m.sport].name)+'</span>'+

    '<span class="eyebrow">'+esc(SP[m.sport].unit.slice(0,-1))+' '+m.court+' · '+t12(m.time)+'</span></div>';

const BALL='<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f7e94a" stroke="#c9b800" stroke-width="1.4"/>'+
 '<circle cx="8.4" cy="8.4" r="1.5" fill="#c9b800"/><circle cx="15.4" cy="8" r="1.4" fill="#c9b800"/>'+
 '<circle cx="12" cy="13.4" r="1.5" fill="#c9b800"/><circle cx="7.6" cy="15" r="1.3" fill="#c9b800"/>'+
 '<circle cx="16" cy="15.6" r="1.3" fill="#c9b800"/></svg>';
const SWAP='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
 'stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><polyline points="16 3 21 3 21 8"/>'+
 '<line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>'+
 '<line x1="4" y1="4" x2="9" y2="9"/></svg>';

function boxHTML(m,tid,pos,cs,locked,fresh){
  const idx=cs.slot[tid][pos], pid=(m.lineup[tid]||[])[slotAt(cs.phase,idx)];
  const key=(tid===m.a)?'a':'b', p=pOf(pid);
  const isServer=(cs.serving===key)&&(cs.which===pos)&&!overOf(m);
  const dead=(!canEdit()||overOf(m)||locked);
  return '<div class="box'+(dead?' locked':'')+(fresh?' justin':'')+
      '" '+(dead?(canEdit()?'':'data-noedit="1"'):'data-tap="'+m.id+'|'+tid+'"')+'>'+
    '<div class="posTag">'+(cs.model==='alt2'
      ? (pos==='R'?'Right half':'Left half')
      : (pos==='R'?'Right / even':'Left / odd'))+'</div>'+
    '<div class="pSlot">'+(isServer?'<span class="ball">'+BALL+'</span>':'')+
      '<span class="sl">'+PAIR_LABEL[cs.phase].slice(-1)+(idx+1)+'</span>'+
      '<span class="pn">'+esc(pName(pid))+'</span>'+
      (p?'<span class="pTag">'+esc(CATS[p.cat].short)+'</span>':'')+'</div>'+
    (isServer?'<div class="servetag">'+(cs.model==='alt2'
       ? 'serves from the right'
       : 'serving from the '+(pos==='R'?'right':'left'))+'</div>':'')+'</div>';
}

function viewRacketMatch(m){
  const A=teamById(m.a), B=teamById(m.b);
  let h=matchHead(m);
  if(!A||!B) return h+'<div class="empty"><b>Waiting on the groups</b>This slot fills automatically once the group matches are done.</div>';

  const sc=scoreOf(m), lead=Math.max(sc.a,sc.b), over=overOf(m), w=racketWinner(m);
  const ready=lineupReady(m), pend=subPending(m), cs=courtState(m);
  const iss=[].concat(lineupIssues(m,m.a).map(s=>A.name+': '+s), lineupIssues(m,m.b).map(s=>B.name+': '+s));
  const finalOv=(state.finalFor===m.id)?finalScoreOverlay(m):'';

  if(canEdit()) h+='<div class="row" style="gap:7px;margin-top:11px;flex-wrap:wrap">'+
    '<button class="btn sm" data-lineup="'+m.id+'">Line-ups</button>'+
    '<button class="btn sm" data-openfinal="'+m.id+'">Final score</button>'+
    (over?'<button class="btn sm" data-sharematch="'+m.id+'">Share</button>':'')+
    '<span class="grow"></span>'+
    '<button class="btn sm" data-shorthand="'+m.id+'">Short-handed</button>'+
    '<button class="btn sm dan" data-resetsc="'+m.id+'">Reset score</button>'+
    '<button class="btn sm dan" data-resetlu="'+m.id+'">Reset line-up</button></div>';

  if(!ready){
    h+='<div class="alert warn"><span>⚠</span><span>Set both line-ups before scoring — three pairs each, '+
      'at least one woman in the six, and no two women paired (§3.1, §3.2).</span></div>';
    if(iss.length) h+='<div class="alert bad"><span>⚠</span><span>'+iss.map(esc).join('<br>')+'</span></div>';
    if(canEdit()) h+='<button class="btn pri" style="width:100%" data-lineup="'+m.id+'">Set the line-ups</button>';
    else h+='<p class="hint">Sign in with the referee PIN to set line-ups and score this match.</p>';
    return h+finalOv;
  }

  /* Ends change at 14 (§5.6). Score panels, court halves and the +/− rows all follow
     the same left/right order, so the referee always taps the side a team stands on. */
  const ends=lead>=SWITCH_AT;
  const baseLeftIsA=((m.startLeft||m.a)===m.a);
  let leftT=ends?(baseLeftIsA?B:A):(baseLeftIsA?A:B);
  let rightT=(leftT===A)?B:A;
  if(m.invert){ const sw=leftT; leftT=rightT; rightT=sw; }
  const scoreOfT=t=>(t.id===m.a)?sc.a:sc.b;

  if(over){
    const wt=teamById(w==='a'?m.a:m.b);
    h+='<div class="alert ok"><span>🏆</span><span><b>'+esc(wt.name)+'</b> win '+lead+'–'+Math.min(sc.a,sc.b)+'.'+
      (lead===TARGET&&Math.min(sc.a,sc.b)===GOLDEN?' Decided on the golden point.':'')+'</span></div>';
  }

  h+='<div class="scorestrip">'+
    '<div class="sTeam"><div class="stripe" style="background:'+leftT.hex+'"></div>'+
      '<div class="nm">'+esc(leftT.name)+'</div>'+
      '<div class="num" style="color:'+tcol(leftT)+'">'+scoreOfT(leftT)+'</div></div>'+
    '<div class="phasebox"><div class="cv">'+PAIR_LABEL[cs.phase].slice(-1)+'</div>'+
      '<div class="cl">Pair</div></div>'+
    '<div class="sTeam right"><div class="stripe" style="background:'+rightT.hex+'"></div>'+
      '<div class="nm">'+esc(rightT.name)+'</div>'+
      '<div class="num" style="color:'+tcol(rightT)+'">'+scoreOfT(rightT)+'</div></div></div>';

  /* pre-match set-up — locks the moment the first point is scored */
  if(!(m.log||[]).length && canEdit() && !over){
    h+='<div class="tossbar"><span class="eyebrow">Serves first</span>'+
      [leftT,rightT].map(t=>{ const on=((m.server||'a')===(t.id===m.a?'a':'b'));
        return '<button class="btn sm'+(on?' pri':'')+'" data-serve="'+m.id+'|'+t.id+'">'+
          (on?BALL+' ':'')+esc(t.name)+'</button>'; }).join('')+
      '<span class="dim" style="font-size:10.5px;font-weight:600">first server starts on the right</span></div>';
    h+='<div class="tossbar"><span class="eyebrow">Court sides</span>'+
      '<span style="font-size:12px;font-weight:700">'+swatch(leftT)+' '+esc(leftT.name)+' <span class="dim">left</span>'+
      ' &nbsp;·&nbsp; '+swatch(rightT)+' '+esc(rightT.name)+' <span class="dim">right</span></span>'+
      '<button class="btn sm" data-startside="'+m.id+'">'+SWAP+' Swap</button>'+
      '<span class="dim" style="font-size:10.5px;font-weight:600">set this to match where the teams actually stand</span></div>';
    h+='<div class="tossbar"><span class="eyebrow">Pair A positions</span>'+
      [leftT,rightT].map(t=>'<span style="font-size:11.5px;font-weight:700">'+swatch(t)+' '+esc(t.name)+
        ' <span class="dim">'+esc(pName(m.lineup[t.id][slotAt(0,rightOf(m,t.id,0))]))+' right</span> '+
        '<button class="btn sm" data-posflip="'+m.id+'|'+t.id+'|0">'+SWAP+'</button></span>').join('')+
      '<span class="dim" style="font-size:10.5px;font-weight:600">the pair chooses its starting server (§5.1)</span></div>';
  }

  if(sc.a===GOLDEN&&sc.b===GOLDEN&&!over)
    h+='<div class="alert bad"><span>⚡</span><span><b>Golden point</b> — the next rally wins the match (§3.3).</span></div>';

  h+='<div class="court" data-sport="'+m.sport+'">'+
    '<div class="half a">'+boxHTML(m,leftT.id,'L',cs,!!pend,!!pend)+boxHTML(m,leftT.id,'R',cs,!!pend,!!pend)+
      '<div class="kitchen"></div><div class="taphint">'+
      (canEdit()&&!over&&!pend?'tap = +1 ':'')+esc(leftT.name)+'</div></div>'+
    '<div class="net"></div>'+
    '<div class="half b">'+boxHTML(m,rightT.id,'R',cs,!!pend,!!pend)+boxHTML(m,rightT.id,'L',cs,!!pend,!!pend)+
      '<div class="kitchen"></div><div class="taphint">'+
      (canEdit()&&!over&&!pend?'tap = +1 ':'')+esc(rightT.name)+'</div></div></div>';

  h+='<div class="endsnote">'+
    (ends?('<span>'+SWAP+' Ends changed at '+SWITCH_AT+' — '+esc(leftT.name)+' now on the left</span>'):'<span></span>')+
    (canEdit()?'<button class="btn sm'+(m.invert?' pri':'')+'" data-invert="'+m.id+'">'+SWAP+
      ' '+(m.invert?'View flipped':'Flip my view')+'</button>':'')+'</div>';

  if(canEdit()){
    h+='<div class="ctrls">'+[leftT,rightT].map(t=>{
      const mine=(t.id===m.a)?sc.a:sc.b;
      return '<div class="ctrlrow">'+
        '<button class="rbtn" data-minus="'+m.id+'|'+t.id+'"'+(mine===0?' disabled':'')+'>−</button>'+
        '<div class="tl">'+esc(t.name)+'</div>'+
        '<button class="rbtn plus" data-tap="'+m.id+'|'+t.id+'"'+((over||pend)?' disabled':'')+
        ' style="background:'+t.hex+'">+</button></div>'; }).join('')+'</div>';
    if((m.log||[]).length) h+='<div class="row" style="gap:7px;margin-bottom:10px">'+
      '<button class="btn sm" data-undo="'+m.id+'">Undo last point</button></div>';
  } else h+='<p class="hint" style="margin-bottom:10px">Sign in with the referee PIN to record points.</p>';

  /* rotation ladder — the leading score is the clock (§3.2) */
  const lo=[0,GATE1,GATE2], hi=[GATE1,GATE2,TARGET];
  h+='<div class="rotwrap"><div class="rothead"><span class="eyebrow">On court</span>'+
    '<span class="big">'+PAIR_LABEL[cs.phase]+'</span>'+
    '<span class="dim" style="font-size:11px;font-weight:600;margin-left:auto">rotation follows the leading score</span></div>'+
    '<div class="ladder">'+[0,1,2].map(i=>{
      const pct=Math.max(0,Math.min(100,(lead-lo[i])/(hi[i]-lo[i])*100));
      return '<div class="gate'+(i===cs.phase?' cur':'')+(lead>=hi[i]?' done':'')+'">'+
        '<div class="bar"><div class="fill" style="width:'+pct+'%"></div>'+
        '<div class="pair">'+PAIR_LABEL[i]+'</div></div>'+
        '<div class="tick">'+PAIR_RANGE[i]+'</div></div>'; }).join('')+'</div>';
  if(over) h+='<div class="countdown">Match complete.</div>';
  else if(pend) h+='<div class="countdown"><b>'+PAIR_LABEL[cs.phase]+'</b> is due on — confirm the rotation to resume.</div>';
  else { const nxt=cs.phase<2?hi[cs.phase]:TARGET, togo=nxt-lead;
    h+='<div class="countdown"><b>'+togo+'</b> '+(togo===1?'point':'points')+
      (cs.phase<2?' to '+PAIR_LABEL[cs.phase+1]+' (leader reaches '+nxt+')'
                 :' to win (first to '+TARGET+')')+'</div>'; }
  h+='</div>';

  /* off-court pairs */
  h+='<div class="ctrls">'+[leftT,rightT].map(t=>{
    const lu=m.lineup[t.id];
    return '<div class="card" style="margin:0;padding:10px 12px"><div class="eyebrow" style="margin-bottom:6px">'+
      esc(t.name)+' · off court</div><div style="display:flex;flex-wrap:wrap;gap:5px">'+
      [0,1,2].filter(i=>i!==cs.phase).map(i=>'<span class="chip" style="cursor:default;font-size:10.5px;padding:4px 9px">'+
        PAIR_LABEL[i].slice(-1)+' · '+esc(pName(lu[i*2]))+' &amp; '+esc(pName(lu[i*2+1]))+'</span>').join('')+
      '</div></div>'; }).join('')+'</div>';

  if(iss.length) h+='<div class="alert bad"><span>⚠</span><span>'+iss.map(esc).join('<br>')+'</span></div>';

  if((m.log||[]).length){
    h+='<div class="eyebrow" style="margin:18px 2px 5px">Rally log</div>'+
       '<div class="card" style="margin:0;font-size:11px;line-height:1.9">';
    let a=0,b=0;
    h+=m.log.map(x=>{ x==='a'?a++:b++; const g=(Math.max(a,b)===GATE1||Math.max(a,b)===GATE2);
      return '<span style="color:'+tcol(x==='a'?A:B)+'">'+a+'-'+b+'</span>'+(g?' <span class="dim">↻</span>':''); }).join(' · ');
    h+='</div>';
  }

  if(finalOv) h+=finalOv;
  else if(pend) h+=rotationOverlay(m,pend,cs,leftT,rightT);
  return h;
}

/* Who may still be dropped into this slot: nominated, available, and not
   already standing in another slot. The sport's marquee only appears in Pair C. */
function slotOptions(m,tid,slot){
  const l=(m.lineup&&m.lineup[tid])||[], used=l.filter((x,i)=>x&&i!==slot);
  const mq=marqueeOf(tid,m.sport), inPairC=slot>=4;
  const partner=l[slot%2===0?slot+1:slot-1];
  const partnerIsWoman=partner&&pOf(partner)&&pOf(partner).g==='F';
  return nomOf(tid,m.sport).filter(pid=>{
    if(used.includes(pid)) return false;                 // already on court elsewhere
    if(isOut(tid,pid)) return false;                     // unavailable on match day
    if(pid===mq && !inPairC) return false;               // marquee closes in Pair C
    if(partnerIsWoman && pOf(pid).g==='F') return false; // two women cannot pair
    return true;
  });
}

/* Suggest a legal line-up: the sport's marquee closes in Pair C alongside the
   lead woman, a second woman goes into a different pair, everyone else fills in. */
function autoLineup(m,tid){
  const nom=nomOf(tid,m.sport).filter(p=>isIn(tid,p));
  if(nom.length<6) return false;
  const rank={MPB:0,MTT:0,MBM:0,GA:1,WM:2,GB:3,WG:4};
  /* In the group stage the suggestion favours squad members who have not been
     on court yet, which is how a team satisfies §3.1 without anyone tracking it
     by hand. Knockouts ignore that and pick the strongest legal six (§2.6). */
  const spread = (m.stage==='group'||m.stage==='league');
  const by=g=>nom.filter(p=>pOf(p).g===g).sort((x,y)=>
    (spread?(hasPlayed(tid,x)?1:0)-(hasPlayed(tid,y)?1:0):0) || rank[pOf(x).cat]-rank[pOf(y).cat]);
  let men=by('M'), wom=by('F');
  if(!wom.length||men.length<4) return false;
  const mq=marqueeOf(tid,m.sport);
  if(mq && men.includes(mq)) men=[mq].concat(men.filter(p=>p!==mq));   // marquee first in hand
  const six=[null,null,null,null,null,null];
  if(mq && men.includes(mq)){ six[4]=mq; men=men.filter(p=>p!==mq); }
  six[5]=wom[0]; wom=wom.slice(1);                    // lead woman closes in the mixed Pair C
  if(wom.length){ six[1]=wom[0]; wom=wom.slice(1); }  // second woman into Pair A, mixed
  [0,2,3,4,1].forEach(i=>{ if(six[i]==null && men.length) six[i]=men.shift(); });
  if(six.some(x=>!x)) return false;
  m.lineup=Object.assign({},m.lineup); m.lineup[tid]=six; return true;
}


/* ============================================================================
   LIVE SYNC
   The app is offline-first: every change is written to this device immediately
   and the tables are always correct locally. Sync copies those changes to the
   other devices through a Supabase table, one row per match / team, and merges
   what comes back. If the venue wifi drops, scoring carries on and the backlog
   goes up the moment the connection returns.

   Conflict rule: each row carries a revision counter. A device only accepts a
   row whose revision is higher than the one it holds, and the server refuses a
   write whose revision is lower than the row already stored — so a device that
   has been offline with stale data cannot overwrite newer scoring.
   ========================================================================== */
const SUPA_URL   = 'https://utfvjsvvbifwcektzrwj.supabase.co';

/* ---------- what each row holds ---------- */
const K_MATCH = id  => sync.event+':m:'+id;
const K_NOM   = tid => sync.event+':nom:'+tid;
const K_AV    = tid => sync.event+':av:'+tid;
const K_PEN   = tid => sync.event+':pen:'+tid;
const K_CFG   = () => sync.event+':cfg:access';

function matchPayload(m){
  return { a:m.a||null, b:m.b||null, done:!!m.done,
           ff:m.ff||null, head:m.head||null,
           log:m.log||null, lineup:m.lineup||null, acked:m.acked||null, pos:m.pos||null,
           startLeft:m.startLeft||null, invert:!!m.invert,
           boards:m.boards||null, pairs:m.pairs||null,
           result:m.result===undefined?null:m.result, players:m.players||null };
}
function applyMatch(id,d){
  const m=state.matches.find(x=>x.id===id); if(!m||!d) return false;
  if(d.a!==undefined&&d.a) m.a=d.a; if(d.b!==undefined&&d.b) m.b=d.b;
  ['log','lineup','acked','pos','startLeft','boards','pairs','players'].forEach(k=>{
    if(d[k]!==undefined&&d[k]!==null) m[k]=d[k]; });
  if(d.result!==undefined) m.result=d.result;
  if(d.ff!==undefined) m.ff=d.ff||null;
  if(d.head!==undefined) m.head=d.head||null;
  m.invert=!!d.invert; m.done=!!d.done;
  return true;
}

/* Every syncable row, as a { key: payloadObject } map. */
function syncSnapshot(){
  const o={};
  state.matches.forEach(m=>{ o[K_MATCH(m.id)]=matchPayload(m); });
  TEAMS.forEach(t=>{ o[K_NOM(t.id)]=state.nom[t.id]||{};
                     o[K_AV(t.id)]=state.avail[t.id]||{};
                     o[K_PEN(t.id)]=state.pen[t.id]||{}; });
  o[K_CFG()]={pinHash:state.pinHash||null, adminHash:state.adminHash||null};
  return o;
}

/* Compare the current state with what this device last sent and queue the
   difference. Called after every save, so no scoring code has to remember to. */
function syncScan(){
  if(!sync.on) return;
  const snap=syncSnapshot(), scoring=state.scorer; let n=0;
  Object.keys(snap).forEach(k=>{
    const s=JSON.stringify(snap[k]);
    if(sync.sent[k]===s) return;
    if(!scoring){ sync.sent[k]=s; return; }   // a viewing device never publishes
    sync.dirty[k]=s; sync.rev[k]=(sync.rev[k]||0)+1; n++;
  });
  sync.pending=Object.keys(sync.dirty).length;
  if(n) schedulePush();
}
/* First run on a device that has never synced: adopt the current state as the
   baseline instead of flooding the table with 100+ untouched fixtures. */
function syncBaseline(){
  const snap=syncSnapshot();
  Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); });
  sync.dirty={}; sync.pending=0; syncSave();
}

function syncLog(msg){
  const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  sync.log.unshift(t+' · '+msg); if(sync.log.length>8) sync.log.pop();
}

async function supa(path,opts){
  const r=await fetch(SUPA_URL+path, Object.assign({
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY,
              'Content-Type':'application/json' } }, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  const txt=await r.text();
  return txt?JSON.parse(txt):null;
}

/* ---------- push ---------- */
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(syncPush,PUSH_MS); }

async function syncPush(){
  if(!sync.on||sync.busy) return;
  const keys=Object.keys(sync.dirty); if(!keys.length) return;
  if(!state.scorer){                                            // viewers never write
    const snap=syncSnapshot();
    Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); });
    sync.dirty={}; sync.pending=0; syncSave(); return; }
  sync.busy=true; syncStatus('sync');
  const batch=keys.slice(0,60);
  const items=batch.map(k=>({key:k, data:JSON.parse(sync.dirty[k]), rev:sync.rev[k]}));
  try{
    const res=await supa('/rest/v1/rpc/osl_put',{ method:'POST',
      body:JSON.stringify({items:items, by:sync.device}) });
    const ok={}; (res||[]).forEach(r=>ok[r.out_key]=r.out_rev);
    batch.forEach(k=>{
      if(ok[k]!==undefined){ sync.sent[k]=sync.dirty[k]; sync.rev[k]=ok[k]; delete sync.dirty[k]; }
      else { delete sync.dirty[k]; }     // server holds a newer row — the pull will bring it
    });
    sync.pending=Object.keys(sync.dirty).length;
    sync.lastOk=Date.now(); syncSave(); syncStatus('live');
    syncLog('sent '+batch.length+' change'+(batch.length>1?'s':''));
    if(sync.pending) schedulePush();
    else setTimeout(()=>syncPull(false),150);   // pick up the other courts straight away
  }catch(e){ syncLog('send failed: '+(e.message||e)); syncStatus('off_line', String(e.message||e)); }
  finally{ sync.busy=false; }
}

/* ---------- pull ---------- */
async function syncPull(force){
  if(!sync.on||sync.pulling) return;
  sync.pulling=true; if(sync.status!=='live') syncStatus('sync');
  try{
    const since=(force?null:sync.cursor);
    const q='/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500'+
      (since?'&updated_at=gt.'+encodeURIComponent(since):'');
    const rows=await supa(q);
    let changed=0, newest=sync.cursor;
    (rows||[]).forEach(r=>{
      if(r.key.indexOf(sync.event+':')!==0) return;
      if(!newest||r.updated_at>newest) newest=r.updated_at;
      const localRev=sync.rev[r.key]||0, remoteStr=JSON.stringify(r.data);
      if(r.rev<localRev) return;                               // ours is newer
      if(r.rev===localRev && sync.sent[r.key]===remoteStr) return;  // same row, nothing to do
      if(sync.dirty[r.key]) return;                            // our own edit is still queued
      const parts=r.key.split(':'), kind=parts[1], id=parts.slice(2).join(':');
      let hit=false;
      if(kind==='m')   hit=applyMatch(id,r.data);
      if(kind==='nom' && teamById(id)){ state.nom[id]=r.data||state.nom[id]; hit=true; }
      if(kind==='av'  && teamById(id)){ state.avail[id]=r.data||{}; hit=true; }
      if(kind==='cfg'){ const d=r.data||{};
        /* the event's password, learned from whoever set it */
        if(d.pinHash!==undefined && d.pinHash!==state.pinHash){ state.pinHash=d.pinHash||null; }
        if(d.adminHash!==undefined && d.adminHash!==state.adminHash){ state.adminHash=d.adminHash||null; }
        hit=true; }
      if(kind==='pen' && teamById(id)){ const d=r.data||{};
        if(d && d.pts) state.pen[id]=d; else delete state.pen[id]; hit=true; }
      if(!hit) return;
      sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++;
    });
    sync.cursor=newest;
    if(changed){
      syncKnockouts();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify({ v:APP_VER, theme:state.theme,
        scorer:state.scorer, admin:state.admin,
        pinHash:state.pinHash, adminHash:state.adminHash, myTeam:state.myTeam,
        matches:state.matches, nom:state.nom, avail:state.avail, pen:state.pen })); }catch(e){}
      const snap=syncSnapshot();                                // adopt as our baseline
      Object.keys(snap).forEach(k=>{ if(!sync.dirty[k]) sync.sent[k]=JSON.stringify(snap[k]); });
    }
    sync.lastOk=Date.now(); sync.lastPull=Date.now(); sync.seen=(rows||[]).length;
    syncSave(); syncStatus('live');
    syncLog(changed?('received '+changed+' change'+(changed>1?'s':'')):'checked · nothing new');
    if(changed && !modal) render();
  }catch(e){ syncLog('pull failed: '+(e.message||e)); syncStatus('off_line', String(e.message||e)); }
  finally{ sync.pulling=false; }
}

function syncStart(){
  sync.on=true; syncSave(); syncStatus('sync');
  clearInterval(pullTimer); pullTimer=setInterval(()=>syncPull(false),PULL_MS);
  syncPull(true).then(()=>{ syncScan(); });
}
function syncStop(){ sync.on=false; clearInterval(pullTimer); pullTimer=null;
  clearTimeout(pushTimer); syncSave(); syncStatus('off'); }

/* Send the whole of this device's state, whatever the revisions say — for the
   device that is seeding the event, or recovering after a wipe elsewhere. */
async function syncPublishAll(){
  if(!sync.on) return toast('Turn live sync on first');
  if(!canManage()) return needAdmin();
  const snap=syncSnapshot();
  Object.keys(snap).forEach(k=>{ sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
  sync.pending=Object.keys(sync.dirty).length;
  toast('Publishing '+sync.pending+' rows…');
  while(Object.keys(sync.dirty).length && sync.on){ await syncPush(); await new Promise(r=>setTimeout(r,120)); }
  toast('Published'); if(modal) openModal(settingsModal());
}

function setShort(m,key,pairs){
  m.ff=null; m.head=null;
  if(pairs===0){ m.ff=(key==='a')?m.a:m.b; m.log=[]; m.acked=[]; m.done=true; }
  else if(pairs<3){
    const head=(pairs===2)?GATE1:GATE2;
    m.head={a:0,b:0}; m.head[otherK(key)]=head;   // the opponent gets the start
    m.log=[]; m.acked=[]; m.done=false;
    const lu=(m.lineup||{})[key==='a'?m.a:m.b]||[];
    if(lu.length){ const keep=lu.filter(Boolean).slice(-pairs*2);
      const arr=[null,null,null,null,null,null];
      keep.forEach((p,i)=>arr[(3-pairs)*2+i]=p);
      m.lineup=Object.assign({},m.lineup); m.lineup[key==='a'?m.a:m.b]=arr; }
  } else { m.done=false; }
  syncKnockouts(); save();
}

/* ============================ SCOPED RESET ============================
   Clearing one match is on the match screen and clearing the whole event is in
   settings. In between is the case that actually comes up on the day: a sport
   was entered against the wrong fixtures, or a round has to be replayed. */
function matchesInScope(sk,stage){
  return state.matches.filter(m=>{
    if(sk!=='all' && m.sport!==sk) return false;
    if(stage==='all') return true;
    if(stage==='group') return m.stage==='group'||m.stage==='league';
    if(stage==='ko') return ['sf','third','final'].indexOf(m.stage)>=0;
    return m.stage+'|'+m.round===stage;                 // a single round
  });
}
function scopeRounds(sk){
  const out=[];
  matchesInScope(sk,'all').forEach(m=>{
    if(m.stage!=='group'&&m.stage!=='league') return;
    const key=m.stage+'|'+m.round;
    if(!out.some(r=>r.key===key))
      out.push({key:key, label:(sk==='all'?SP[m.sport].short+' · ':'')+
        (m.stage==='group'?'Group round ':'Round ')+m.round});
  });
  return out;
}
function clearMatch(m,alsoLineups){
  m.log=[]; m.acked=[]; m.done=false; m.result=null; m.ff=null; m.head=null;
  if(m.boards) m.boards=[{a:null,b:null},{a:null,b:null}];
  if(alsoLineups){ m.lineup={}; m.pos={}; m.pairs={}; m.players={}; m.invert=false; m.startLeft=null; }
}
function resetScope(sk,stage,alsoLineups){
  const list=matchesInScope(sk,stage);
  list.forEach(m=>clearMatch(m,alsoLineups));
  syncKnockouts(); save(); render();
  toast('Cleared '+list.length+' match'+(list.length===1?'':'es'));
}

/* ============================ ACCESS ============================
   Two levels, and they answer different questions.

   ADMIN is the organiser. It sets up the event, edits teams, applies penalties,
   prints and resets. Its password ships with the app and can only be changed by
   someone who already knows it.

   REFEREE is the courts. A PIN the admin sets, handed to whoever is scoring.
   It records results and nothing else — no team edits, no printing, no resets.

   Everyone else just watches.

   Both are held as salted hashes and travel with the live sync, so a device
   that has never been used still knows the event's passwords and cannot make
   itself an editor. Be clear-eyed about what this is: a lock on the front door,
   not a vault. It all runs in the browser against a public key, so someone
   determined can get past it. It stops the realistic case at a tournament — a
   player picking up a stray phone, a spectator poking at the link. */
const ADMIN_DEFAULT = 'Hello43556';

async function hashPin(p,kind){
  const salted='osl2026|'+(kind||'ref')+'|'+(sync.event||'')+'|'+p;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salted));
      return [].slice.call(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381;                                     // only if SHA-256 is unavailable
  for(let i=0;i<salted.length;i++){ h=((h*33)^salted.charCodeAt(i))>>>0; }
  return 'x'+h.toString(16);
}
const pinIsSet = () => !!(state.pinHash&&state.pinHash.length);

/* The shipped admin password is the starting point for every event; changing it
   replaces the hash, and the new one syncs to the other devices. */
async function adminHashNow(){
  if(state.adminHash) return state.adminHash;
  return await hashPin(ADMIN_DEFAULT,'admin');
}

let swTimer=null;
function startSwitchTimer(){
  clearInterval(swTimer); swTimer=null;
  const el=document.getElementById('swtimer'); if(!el) return;
  let left=SWITCH_SECONDS;
  swTimer=setInterval(()=>{

/* ===================== score entry focus =====================
   The Tab bug came from repainting while the browser was still moving focus:
   the box Tab was travelling to had already been replaced, so the rest of the
   number went nowhere or into the next match. Suppressing the repaint fixed the
   typing but left the standings, the knockout wiring and the champion stale
   until the caret left the box.

   So the repaint stays, and instead the caret is put back exactly where it was.
   No input event fires while Tab is in flight, so there is no race to lose, and
   a repaint becomes invisible to whoever is typing. */
function focusedEntry(){
  const a=document.activeElement;
  if(!a||!a.classList||!a.classList.contains('esc')) return null;
  return a.getAttribute('data-esc')||a.getAttribute('data-ecb')||null;
}
function grabFocus(){
  const a=document.activeElement;
  if(!a||!a.classList||!a.classList.contains('esc')) return null;
  const k=a.getAttribute('data-esc')?'data-esc':'data-ecb';
  let s=null,e=null; try{ s=a.selectionStart; e=a.selectionEnd; }catch(x){}
  return {attr:k, val:a.getAttribute(k), s:s, e:e};
}
function putFocus(f){
  if(!f||!f.val) return;
  const el=document.querySelector('input.esc['+f.attr+'="'+f.val+'"]');
  if(!el||el.disabled) return;
  el.focus();
  if(f.s!=null){ try{ el.setSelectionRange(f.s,f.e); }catch(x){ } }
  else { const v=el.value; el.value=''; el.value=v; }   // caret to the end
}

function render(){
  const keep=grabFocus();
  paint();
  putFocus(keep);
}
