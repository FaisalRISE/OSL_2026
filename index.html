    const list=matchesInScope(sk,stage), played=list.filter(isPlayed).length;
    if(played && !confirm('Clear '+played+' recorded result'+(played===1?'':'s')+
      (also?' and the line-ups':'')+'?\n\nThis cannot be undone.')) return;
    closeModal(); return resetScope(sk,stage,also); }
  if(g('data-refunlock')) return refUnlock();
  if(g('data-adminunlock')) return adminUnlock();
  if(g('data-pinset')) return pinSave();
  if(g('data-adminset')) return adminSave();
  if(g('data-pinchange')){ if(!canManage()) return needAdmin(); return openModal(pinSetModal()); }
  if(g('data-adminchange')){ if(!canManage()) return needAdmin(); return openModal(adminChangeModal()); }
  if((el=g('data-scorer'))){
    if(el.getAttribute('data-scorer')==='off'){ state.scorer=false; state.admin=false; save();
      toast('Signed out — view only'); return openModal(settingsModal()); }
    return askScorer();
  }
  if(g('data-export')){
    const blob=new Blob([JSON.stringify({v:APP_VER,matches:state.matches,nom:state.nom,avail:state.avail},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='osl-2026-backup.json'; a.click(); return toast('Backup downloaded');
  }
  if(g('data-csv')){
    const rows=[['Sport','Stage','Round','Court','Time','Team A','Team B','Score A','Score B','Result']];
    state.matches.forEach(m=>{ const s=scoreText(m), r=resultOf(m);
      rows.push([SP[m.sport].name,stageName(m),m.round,m.court,m.time,
        (teamById(m.a)||{}).name||'TBD',(teamById(m.b)||{}).name||'TBD',s[0],s[1],
        r?(r==='d'?'Draw':(teamById(r==='a'?m.a:m.b)||{}).name):'']); });
    const csv=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='osl-2026-results.csv'; a.click(); return toast('CSV downloaded');
  }
  if(g('data-import')){
    const i=document.createElement('input'); i.type='file'; i.accept='.json';
    i.onchange=()=>{ const f=i.files[0]; if(!f) return; const rd=new FileReader();
      rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
          localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},d,
            {theme:state.theme,pinHash:state.pinHash,adminHash:state.adminHash})));
          location.reload(); }catch(err){ toast('That file could not be read'); } };
      rd.readAsText(f); };
    i.click(); return;
  }
  /* Clearing the device alone was not enough once sync was on: the next poll
     simply pulled every score back from the shared copy. A full reset has to
     clear the shared copy too, which only a scorer may do. */
  if(g('data-wipe')){ if(!canManage()) return needAdmin();
    if(!confirm('Clear every score, line-up, nomination and penalty on THIS DEVICE?\n\n'+
      (sync.on?'The shared copy is untouched, so anything still on the other devices will come back on the next check.':'')))
      return;
    localStorage.removeItem(STORE_KEY); localStorage.removeItem(SYNC_KEY); location.reload(); }

  if(g('data-wipeall')){
    if(!canManage()) return needAdmin();
    if(!confirm('Reset the WHOLE EVENT on every device?\n\nAll scores, line-ups, nominations and penalties '+
      'go back to the starting point, everywhere. This cannot be undone.')) return;
    if(!confirm('Last check — every result recorded so far will be gone. Continue?')) return;
    resetEvent(); }
});

/* Tab and Enter both walk the score boxes in reading order — left score, right
   score, next match. The chevron that opens the referee console is skipped, and
   the scroll wheel is ignored so a stray scroll cannot nudge a number. */
function entryBoxes(){ return [].slice.call(document.querySelectorAll('.erow .esc:not([disabled])')); }
function stepEntry(el,dir){
  const all=entryBoxes(), i=all.indexOf(el);
  if(i<0) return false;
  const next=all[i+dir];
  if(!next) return false;
  next.focus(); if(next.select) next.select();
  return true;
}
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(!el||!el.classList||!el.classList.contains('esc')) return;
  if(e.key==='Enter'){ e.preventDefault(); if(!stepEntry(el,1)) el.blur(); return; }
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault();
    stepEntry(el,e.key==='ArrowDown'?1:-1); }
});
document.addEventListener('wheel',e=>{
  if(e.target&&e.target.classList&&e.target.classList.contains('esc')&&document.activeElement===e.target)
    e.target.blur();
},{passive:true});
/* Restyle just this row while typing: winner in bold, the section's played
   tally, the done tint. Cheap enough to run on every keystroke. */
function markEntryRow(el,m){
  const row=el.closest('.erow');
  if(row){
    const r=resultOf(m);
    row.classList.toggle('done',!!r);
    const sides=row.querySelectorAll('.eside');
    if(sides[0]){ sides[0].classList.toggle('w',r==='a'); sides[0].classList.toggle('l',r==='b'); }
    if(sides[1]){ sides[1].classList.toggle('w',r==='b'); sides[1].classList.toggle('l',r==='a'); }
  }
  const cnt=(el.closest('.fxsec')||document).querySelector('.fxhd .cnt');
  if(cnt){ const list=state.matches.filter(x=>x.sport===m.sport);
    cnt.textContent=list.filter(isPlayed).length+'/'+list.length; }
}
/* Leaving the boxes — by tapping away, or Tab off the last one — is the moment
   everything downstream is brought up to date. Tab between boxes keeps focus
   inside the entry list, so nothing is repainted mid-round. */
document.addEventListener('focusout',e=>{
  const el=e.target;
  if(!el||!el.classList||!el.classList.contains('esc')) return;
  setTimeout(()=>{ if(!focusedEntry()) render(); },0);
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.tagName==='INPUT' && el.hasAttribute('data-final')){
    if(el.getAttribute('data-final')==='a') state.finalA=el.value; else state.finalB=el.value;
  }
});

/* Score entry keeps up with the keyboard: each keystroke updates the match, but
   the page is not rebuilt until the box is left, or the caret would jump away
   mid-number. Only the row's own styling is refreshed as you type. */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.tagName==='INPUT' && el.hasAttribute('data-final')){
    if(el.getAttribute('data-final')==='a') state.finalA=el.value; else state.finalB=el.value;
  }
});

/* Score entry keeps up with the keyboard: each keystroke updates the match, but
   the page is not rebuilt until the box is left, or the caret would jump away
   mid-number. Only the row's own styling is refreshed as you type. */
function markEntryRow(el,m){
  const row=el.closest('.erow');
  if(row){
    const r=resultOf(m);
    row.classList.toggle('done',!!r);
    const sides=row.querySelectorAll('.eside');
    if(sides[0]){ sides[0].classList.toggle('w',r==='a'); sides[0].classList.toggle('l',r==='b'); }
    if(sides[1]){ sides[1].classList.toggle('w',r==='b'); sides[1].classList.toggle('l',r==='a'); }
  }
  /* keep this sport's played tally honest without rebuilding the page */
  const sec=(el.closest('.fxsec')||document).querySelector('.fxhd .cnt');
  if(sec){ const list=state.matches.filter(x=>x.sport===m.sport);
    sec.textContent=list.filter(isPlayed).length+'/'+list.length; }
}
document.addEventListener('input',e=>{
  const el=e.target; let a;
  if((a=el.getAttribute('data-esc'))){ const [id,side]=a.split('|');
    const m=state.matches.find(x=>x.id===id); if(!m) return;
    const clean=el.value.replace(/[^0-9]/g,'').slice(0,2);
    if(clean!==el.value) el.value=clean;
    if(Number(clean)>TARGET) el.value=String(TARGET);
    setFinal(m,side,el.value);
    el.classList.toggle('filled',el.value!=='');
    markEntryRow(el,m); return; }
  if((a=el.getAttribute('data-ecb'))){ const [id,bi,side]=a.split('|');
    const m=state.matches.find(x=>x.id===id); if(!m) return;
    const clean=el.value.replace(/[^0-9]/g,'').slice(0,3);
    if(clean!==el.value) el.value=clean;
    m.boards[+bi][side]=el.value===''?null:Number(el.value);
    m.done=carromPlayed(m); save();
    el.classList.toggle('filled',el.value!=='');
    markEntryRow(el,m); return; }
});

document.addEventListener('change',e=>{
  const el=e.target; let a;

  if((a=el.getAttribute('data-lp'))){ const [id,tid,slot]=a.split('|');
    const m=state.matches.find(x=>x.id===id);
    m.lineup=Object.assign({},m.lineup); const arr=(m.lineup[tid]||[]).slice();
    while(arr.length<6) arr.push(null);
    arr[+slot]=el.value||null; m.lineup[tid]=arr; save(); return openModal(lineupModal(m)); }
  if((a=el.getAttribute('data-cb'))){ const [id,bi,side]=a.split('|');
    const m=state.matches.find(x=>x.id===id);
    m.boards[+bi][side]=el.value===''?null:Number(el.value);
    m.done=carromPlayed(m); save(); return render(); }
  if((a=el.getAttribute('data-cp'))){ const [id,tid,bi,si]=a.split('|');
    const m=state.matches.find(x=>x.id===id); m.pairs=m.pairs||{};
    const p=m.pairs[tid]||{}; const key='b'+(+bi+1); const arr=(p[key]||[]).slice();
    while(arr.length<2) arr.push(null); arr[+si]=el.value||null;
    p[key]=arr; m.pairs[tid]=p; save(); return; }
  if((a=el.getAttribute('data-chp'))){ const [id,tid]=a.split('|');
    const m=state.matches.find(x=>x.id===id); m.players=m.players||{};
    m.players[tid]=el.value||null; save(); return; }
  if(el.getAttribute('data-myteam')!==null && el.hasAttribute('data-myteam')){
    state.myTeam=el.value||null; save(); return openModal(settingsModal()); }
});

/* ============================ BOOT ============================ */
syncLoad();
load();
render();
if(sync.on){ if(!Object.keys(sync.sent).length) syncBaseline(); syncStart(); }
else syncStatus('off');
/* Come back from a locked screen or a backgrounded tab with the latest scores. */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&sync.on) syncPull(false); });
setInterval(()=>{ if(document.getElementById('syncstat')) syncChrome(); },1000);
window.addEventListener('online',()=>{ if(sync.on){ syncPull(false); schedulePush(); } });
</script>
